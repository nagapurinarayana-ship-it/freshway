name: Cash fix runner

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cash-fix-runner.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Patch Owner overview loading
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin.js')
          s=p.read_text()
          old="if(id==='overview'){loadBusiness().catch(e=>toast(e.message));loadHome()}"
          new="if(id==='overview'){Promise.all([loadSummary(),loadBusiness(),loadHome()]).catch(e=>toast(e.message))}"
          if old not in s: raise SystemExit('admin.js: expected overview navigation block not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check admin.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.js
          git diff --cached --check
          git commit -m 'fix: load all Owner overview data'
          git push origin HEAD:main
