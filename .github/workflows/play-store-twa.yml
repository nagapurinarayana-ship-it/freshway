name: FreshWay Play Store TWA checks

on:
  push:
    branches:
      - main
      - feature/play-store-readiness-20261023
    paths:
      - 'android-twa/**'
      - 'manifest.webmanifest'
      - 'icons/**'
      - 'index.html'
      - 'privacy.html'
      - 'delete-account.html'
      - '.github/workflows/play-store-twa.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'android-twa/**'
      - 'manifest.webmanifest'
      - 'icons/**'
      - 'index.html'
      - 'privacy.html'
      - 'delete-account.html'
      - '.github/workflows/play-store-twa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-twa-preparation:
    name: Validate TWA configuration and packaging guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Syntax-check local validation scripts
        run: |
          node --check android-twa/scripts/validate-config.mjs
          node --check android-twa/scripts/validate-repository.mjs
          node --check android-twa/scripts/validate-generated-project.mjs
          node --check android-twa/scripts/generate-assetlinks.mjs
          node --check android-twa/scripts/test-assetlinks.mjs

      - name: Test TWA configuration, repository assets and Asset Links generator
        working-directory: android-twa
        run: npm test
