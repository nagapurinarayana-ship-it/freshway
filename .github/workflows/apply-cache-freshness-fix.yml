name: Apply cache freshness patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-cache-freshness-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Apply surgical cache protections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('admin.js')
          s = p.read_text()
          old = "fetch(`/api${path}`,{...opt,credentials:'include',headers:h})"
          new = "fetch(`/api${path}`,{...opt,cache:'no-store',credentials:'include',headers:h})"
          if s.count(old) == 1:
              p.write_text(s.replace(old, new, 1))

          p = Path('worker/src/index.js')
          s = p.read_text()
          old = "'content-type':'application/json; charset=utf-8',"
          new = "'content-type':'application/json; charset=utf-8','cache-control':'no-store, no-cache, must-revalidate, max-age=0',"
          if s.count(old) == 1:
              p.write_text(s.replace(old, new, 1))

          p = Path('owner-lifecycle.js')
          s = p.read_text()
          pattern = r"  async function enhanceCash\(force=false\)\{.*?\n  function orderCardForCash"
          replacement = r'''  async function enhanceCash(force=false){
    const root=document.getElementById('cashSummary');
    if(!root||(!force&&root.dataset.cashEnhanced==='1'))return;
    try{
      const fetchAll=async payment=>{
        const all=[];let page=1,total=Infinity;
        while(all.length<total&&page<=20){
          const d=await api(`/admin/orders?page=${page}&limit=100&payment=${payment}&sort=newest`);
          const rows=d.orders||[];all.push(...rows);total=Number(d.pagination?.total||all.length);
          if(!rows.length)break;page++;
        }
        return all;
      };
      const [pendingRows,collectedRows]=await Promise.all([fetchAll('Pending'),fetchAll('Collected')]);
      const pending=pendingRows.filter(o=>o.status!=='Cancelled');
      const today=istDay(new Date());
      const collected=(collectedRows||[]).filter(o=>o.status!=='Cancelled'&&istDay(o.paymentCollectedAt||o.updatedAt||o.createdAt)===today);
      const pendingTotal=pending.reduce((sum,o)=>sum+Number(o.total||0),0);
      const collectedTotal=collected.reduce((sum,o)=>sum+Number(o.total||0),0);
      root.dataset.cashEnhanced='1';
      root.innerHTML=`<div class="cash-summary-grid"><article class="report"><span>Cash pending</span><strong>${money2(pendingTotal)}</strong><small>${pending.length} orders still outstanding · all dates</small></article><article class="report"><span>Cash collected today</span><strong>${money2(collectedTotal)}</strong><small>${collected.length} collections today</small></article></div><div class="cash-collected-total"><span>Outstanding cash to clear</span><strong>${money2(pendingTotal)}</strong></div>`;
      const list=document.getElementById('cashList');
      if(list)list.innerHTML=pending.length?`<div class="section-head"><div><span class="eyebrow">PENDING CASH</span><h2>Cash still to be collected</h2><p>${pending.length} orders · ${money2(pendingTotal)} outstanding · all dates</p></div></div>`+pending.map(orderCardForCashPending).join(''):'<div class="empty">All clear — no pending cash.</div>';
    }catch(e){root.dataset.cashEnhanced='';toast(e.message)}
  }
  function orderCardForCashPending(o){return `<article class="card order-card" data-order="${esc2(o.id)}"><div class="card-top"><div><b>${esc2(o.id)}</b><small>${esc2(new Date(o.createdAt).toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}))}</small></div><span class="badge ${esc2(o.status||'')}">${esc2(o.status||'Pending')}</span></div><div class="person"><div><b>${esc2(o.customer?.name||'Customer')}</b><small>📞 ${esc2(o.customer?.phone||'')}</small></div><strong>${money2(o.total)}</strong></div><div class="meta">${(o.items||[]).slice(0,3).map(i=>`${esc2(i.name)} ×${i.qty}`).join(' · ')}${(o.items||[]).length>3?' · +more':''}</div><div class="card-foot"><span>🚚 ${esc2(o.deliveryPlan||'Unscheduled')}</span><span class="pay">💵 Pending cash</span></div></article>`}
  function orderCardForCash'''
          if not re.search(pattern, s, flags=re.S):
              raise SystemExit('Expected enhanceCash block not found')
          p.write_text(re.sub(pattern, replacement, s, count=1, flags=re.S))

          for name in ['admin.html','sw.js']:
              p = Path(name)
              s = p.read_text()
              old = 'owner-lifecycle.js?v=20260909-refresh-v3'
              new = 'owner-lifecycle.js?v=20260909-refresh-v4'
              if s.count(old) != 1:
                  raise SystemExit(f'{name}: expected one owner-lifecycle v3 reference, found {s.count(old)}')
              p.write_text(s.replace(old, new, 1))
          PY

      - name: Validate JavaScript syntax
        run: |
          node --check admin.js
          node --check worker/src/index.js
          node --check owner-lifecycle.js

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.js worker/src/index.js owner-lifecycle.js admin.html sw.js
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'fix: show all outstanding cash payments'
          git push origin HEAD:main
