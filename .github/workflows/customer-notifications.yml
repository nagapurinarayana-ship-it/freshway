name: FreshWay customer notification validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  notifications:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check customer notification JavaScript
        run: |
          node --check frontend/customer/notifications.js
          node --check frontend/customer/notifications.test.js
      - name: Run customer notification tests
        run: node frontend/customer/notifications.test.js
      - name: Enforce customer notification boundary
        run: |
          grep -q "window.FreshWayCustomerNotifications" frontend/customer/notifications.js
          grep -q "const customerNotifications=window.FreshWayCustomerNotifications" app.js
          grep -q "customerNotifications.registerCustomer" frontend/customer/checkout-submit.js
          grep -q "frontend/customer/notifications.js" index.html
          grep -q "notifications.enable()" frontend/customer/account-actions.js
          grep -q "auth.logout()" frontend/customer/account-actions.js
