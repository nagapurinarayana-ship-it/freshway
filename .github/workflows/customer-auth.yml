name: FreshWay customer auth validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  auth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check customer auth JavaScript
        run: |
          node --check frontend/customer/auth.js
          node --check frontend/customer/auth.test.js
      - name: Run customer auth tests
        run: node frontend/customer/auth.test.js
      - name: Enforce customer auth boundary
        run: |
          grep -q "window.FreshWayCustomerAuth" frontend/customer/auth.js
          grep -q "const customerAuth=window.FreshWayCustomerAuth" app.js
          grep -q "customerAuth.ensureAuthenticated" frontend/customer/checkout-submit.js
          grep -q "frontend/customer/auth.js" index.html
