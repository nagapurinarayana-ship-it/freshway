name: FreshWay production Owner PWA smoke

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/production-owner-pwa-smoke.yml'
      - 'pwa-owner-live-smoke.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freshway-production-owner-pwa-smoke
  cancel-in-progress: false

jobs:
  owner-pwa-live-smoke:
    name: Verify deployed Owner PWA and API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verify production Owner PWA
        env:
          OWNER_PWA_BASE_URL: https://fwcoldpressed.in
        run: node pwa-owner-live-smoke.mjs
