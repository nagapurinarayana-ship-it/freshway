name: FreshWay Preview Pages secret sync

on:
  push:
    branches:
      - test/expand-playwright-coverage
    paths:
      - ".github/workflows/preview-pages-secret-sync.yml"

permissions:
  contents: read

concurrency:
  group: freshway-preview-pages-secret-sync
  cancel-in-progress: false

jobs:
  sync-preview-secret:
    name: Sync Preview-only Pages service credential
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 10
    steps:
      - name: Checkout trusted branch
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Set the Pages Preview secret from the encrypted GitHub Preview secret
        working-directory: worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_ADMIN_TOKEN: ${{ secrets.PREVIEW_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID PREVIEW_ADMIN_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "Required encrypted Preview value is missing: $name"
              exit 1
            fi
          done

          # Pass the secret only over stdin. Never print, encode, or upload its value.
          if ! printf '%s' "$PREVIEW_ADMIN_TOKEN" | npx --yes wrangler@4.130.0 pages secret put PREVIEW_ADMIN_TOKEN --project-name=freshway --env preview --log-level error; then
            echo "Pages secret sync failed. The configured Cloudflare API token may not include Cloudflare Pages:Edit."
            exit 1
          fi
          echo "PREVIEW_ADMIN_TOKEN was accepted for the FreshWay Pages Preview environment."
