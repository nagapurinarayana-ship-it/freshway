name: FreshWay production order-to-store routing audit

on:
  push:
    branches:
      - "audit/production-order-routing-20261103"
    paths:
      - ".github/workflows/audit-production-order-store-routing.yml"
      - "worker/scripts/audit-production-order-routing.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freshway-production-order-store-routing-audit
  cancel-in-progress: false

jobs:
  read-only-order-routing-audit:
    name: Read-only production order-to-store verification
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Checkout audit-only branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Worker dependencies
        working-directory: worker
        run: npm install

      - name: Require production read credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Compare production order assignments to their delivery stores (read-only)
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/audit-production-order-routing.mjs
