name: FreshWay Worker release

on:
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freshway-production-worker
  cancel-in-progress: false

jobs:
  release:
    name: Validate and deploy production API
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install Worker dependencies
        working-directory: worker
        run: npm install
      - name: Audit Worker dependencies
        working-directory: worker
        run: npm audit --audit-level=high
      - name: Run Worker tests
        working-directory: worker
        run: npm test
      - name: Check Worker JavaScript
        working-directory: worker
        run: |
          node --check src/index.js
          node --check src/passcode-auth.js
          node --check src/admin-auth.js
      - name: Validate Wrangler configuration
        working-directory: worker
        run: node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8')); const required=['ADMIN_TOKEN','CUSTOMER_SESSION_SECRET','ADMIN_SESSION_SECRET']; const optional=['TWILIO_ACCOUNT_SID','TWILIO_AUTH_TOKEN','TWILIO_VERIFY_SERVICE_SID']; if(x.main!=='src/admin-auth.js'||required.some(s=>!x.secrets?.required?.includes(s))||optional.some(s=>!x.secrets?.optional?.includes(s))||x.secrets.optional.some(s=>!optional.includes(s))||x.vars?.OTP_PROVIDER) process.exit(1)"
      - name: Check production deployment credentials
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "Cloudflare deployment credentials are missing. Refusing to report a production release as successful without applying D1 migrations and deploying the Worker."
            exit 1
          fi
      - name: Apply D1 migrations
        if: steps.cloudflare.outputs.available == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply freshway --remote --config wrangler.jsonc
      - name: Deploy Worker
        if: steps.cloudflare.outputs.available == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc

# Production API deploys automatically when worker code or this deployment workflow changes.
