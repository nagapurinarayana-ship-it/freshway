name: FreshWay Worker release

on:
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freshway-production-worker
  cancel-in-progress: false

jobs:
  release:
    name: Validate and deploy production API
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install Worker dependencies
        working-directory: worker
        run: npm install
      - name: Audit Worker dependencies
        working-directory: worker
        run: npm audit --audit-level=high
      - name: Run Worker tests
        working-directory: worker
        run: npm test
      - name: Check Worker JavaScript
        working-directory: worker
        run: |
          node --check src/index.js
          node --check src/passcode-auth.js
          node --check src/admin-auth.js
          node --check src/admin-notifications.js
          node --check src/order-alerts.js
          node --check src/customer-messages.js
          node --check src/account-deletion.js
      - name: Validate Wrangler configuration
        working-directory: worker
        run: node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8')); const required=['ADMIN_TOKEN','CUSTOMER_SESSION_SECRET','ADMIN_SESSION_SECRET','VAPID_PUBLIC_KEY','VAPID_PRIVATE_KEY','VAPID_SUBJECT']; if(x.main!=='src/admin-auth.js'||required.some(s=>!x.secrets?.required?.includes(s))||x.secrets.optional||x.vars?.OTP_PROVIDER) process.exit(1)"
      - name: Check production deployment credentials
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "Cloudflare deployment credentials are missing. Refusing to report a production release as successful without applying D1 migrations and deploying the Worker."
            exit 1
          fi
      - name: Ensure transactional push credentials without rotating existing subscriptions
        if: steps.cloudflare.outputs.available == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          existing="$(npx wrangler secret list --format json --config wrangler.jsonc)"
          has_public="$(printf '%s' "$existing" | node -e "const x=JSON.parse(require('fs').readFileSync(0,'utf8'));process.stdout.write(x.some(s=>s.name==='VAPID_PUBLIC_KEY')?'yes':'no')")"
          has_private="$(printf '%s' "$existing" | node -e "const x=JSON.parse(require('fs').readFileSync(0,'utf8'));process.stdout.write(x.some(s=>s.name==='VAPID_PRIVATE_KEY')?'yes':'no')")"
          has_subject="$(printf '%s' "$existing" | node -e "const x=JSON.parse(require('fs').readFileSync(0,'utf8'));process.stdout.write(x.some(s=>s.name==='VAPID_SUBJECT')?'yes':'no')")"
          if [ "$has_public" = yes ] && [ "$has_private" = yes ] && [ "$has_subject" = yes ]; then
            echo "Transactional push credentials already exist; preserving the current keypair."
          elif [ "$has_public" = no ] && [ "$has_private" = no ] && [ "$has_subject" = no ]; then
            key_file="$RUNNER_TEMP/freshway-vapid-keys.json"
            node -e "process.stdout.write(JSON.stringify(require('web-push').generateVAPIDKeys()))" > "$key_file"
            node -e "const k=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));process.stdout.write(k.publicKey)" "$key_file" | npx wrangler secret put VAPID_PUBLIC_KEY --config wrangler.jsonc
            node -e "const k=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));process.stdout.write(k.privateKey)" "$key_file" | npx wrangler secret put VAPID_PRIVATE_KEY --config wrangler.jsonc
            printf '%s' 'https://fwcoldpressed.in/' | npx wrangler secret put VAPID_SUBJECT --config wrangler.jsonc
            rm -f "$key_file"
            echo "Created and stored a persistent VAPID keypair for push alerts. Key values were not written to the workflow log."
          else
            echo "VAPID configuration is partial. Refusing to rotate the keypair because existing device subscriptions may depend on it. Configure VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY and VAPID_SUBJECT together, then rerun."
            exit 1
          fi
      - name: Apply D1 migrations
        if: steps.cloudflare.outputs.available == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply freshway --remote --config wrangler.jsonc
      - name: Verify production D1 schema after migrations
        if: steps.cloudflare.outputs.available == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/audit-production-schema.mjs
      - name: Deploy Worker
        if: steps.cloudflare.outputs.available == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc

# Production API deploys automatically when worker code or this deployment workflow changes.
