name: FreshWay production customer Playwright

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-customer-playwright.yml'
      - 'app.js'
      - 'index.html'
      - 'frontend/customer/**'
      - 'e2e/playwright.production.config.js'
      - 'e2e/production/**'
      - 'app.js'
      - 'index.html'
      - 'sw.js'
      - 'frontend/customer/delivery-booking.js'
      - 'frontend/customer/delivery-offers.js'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-customer-playwright.yml'
      - 'e2e/production/store-availability.spec.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freshway-production-customer-playwright
  cancel-in-progress: false

jobs:
  production-customer:
    name: Customer-only production browser tests
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FRESHWAY_PRODUCTION_URL: https://fwcoldpressed.in
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Worker dependencies
        working-directory: worker
        run: npm install

      - name: Find real production store and stocked product (read-only)
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Production D1 read credentials are missing. No production data was changed."
            exit 1
          fi
          npx wrangler d1 execute freshway --remote --config wrangler.jsonc --command "WITH reserved AS (SELECT store_id,product_id,SUM(qty) qty FROM delivery_store_inventory_reservations WHERE status IN ('reserved','conflict') GROUP BY store_id,product_id) SELECT s.id store_id,s.name store_name,s.latitude,s.longitude,s.service_radius_km,s.is_active store_active,p.id product_id,p.name product_name,p.unit,p.price central_price,p.active product_active,p.category_id,c.name category_name,p.stock_managed,c.active category_active,i.store_id inventory_store_id,sc.store_id catalogue_store_id,sc.is_available store_product_available,sc.price_override,COALESCE(sc.price_override,p.price) effective_price,MAX(0,COALESCE(i.stock_quantity,0)-COALESCE(r.qty,0)) available_qty FROM delivery_stores s CROSS JOIN products p LEFT JOIN categories c ON c.id=p.category_id LEFT JOIN delivery_store_inventory i ON i.store_id=s.id AND i.product_id=p.id LEFT JOIN delivery_store_catalogue sc ON sc.store_id=s.id AND sc.product_id=p.id LEFT JOIN reserved r ON r.store_id=s.id AND r.product_id=p.id ORDER BY s.name,p.id" --json > "$RUNNER_TEMP/freshway-store-fixture.json"
          node --input-type=module - "$RUNNER_TEMP/freshway-store-fixture.json" "$GITHUB_ENV" <<'NODE'
          import fs from 'node:fs';
          const raw=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const batches=Array.isArray(raw)?raw:[raw];
          const rows=batches.flatMap(x=>Array.isArray(x?.results)?x.results:[]);
          if(!rows.length) throw new Error('Production D1 returned no store/product inventory rows.');
          const numeric=value=>Number(value);
          // The live store resolver and availability endpoint can backfill missing
          // catalogue/inventory rows. Require both matrices to be complete before
          // making any production POST that could otherwise write those rows.
          const missingInventory=rows.filter(row=>numeric(row.stock_managed)===1&&!row.inventory_store_id);
          const missingCatalogue=rows.filter(row=>!row.catalogue_store_id);
          if(missingInventory.length||missingCatalogue.length) {
            throw new Error('Read-only safety stop: missing inventory rows='+missingInventory.length+', missing store catalogue rows='+missingCatalogue.length+'. No production customer API POST was sent.');
          }
          const distanceKm=(aLat,aLng,bLat,bLng)=>{
            const rad=v=>v*Math.PI/180,dLat=rad(bLat-aLat),dLng=rad(bLng-aLng);
            const x=Math.sin(dLat/2)**2+Math.cos(rad(aLat))*Math.cos(rad(bLat))*Math.sin(dLng/2)**2;
            return 6371*2*Math.asin(Math.min(1,Math.sqrt(x)));
          };
          const stores=[...new Map(rows.filter(row=>numeric(row.store_active)===1).map(row=>[String(row.store_id),{
            id:String(row.store_id),name:String(row.store_name),lat:numeric(row.latitude),lng:numeric(row.longitude),radius:numeric(row.service_radius_km)
          }])).values()].filter(s=>Number.isFinite(s.lat)&&Number.isFinite(s.lng)&&Math.abs(s.lat)<=90&&Math.abs(s.lng)<=180&&Number.isFinite(s.radius)&&s.radius>0);
          const byProduct=new Map();
          for(const row of rows){
            if(numeric(row.product_active)!==1||numeric(row.category_active)!==1) continue;
            const productId=String(row.product_id);
            if(!byProduct.has(productId))byProduct.set(productId,[]);
            byProduct.get(productId).push({...row,productId,available:numeric(row.available_qty)});
          }

          // Use the public Mancherial Head Post Office location as the customer's
          // verified delivery pin: Indra Nagar / Janmabhoomi Nagar, PIN 504208.
          // Resolve the nearest store with at least one visible, sellable product,
          // matching the production /api/delivery/store resolver's selection rules.
          const mancherialAddress={latitude:18.880305,longitude:79.442307};
          const nearbyMancherialStores=stores.map(store=>({
            ...store,
            distance:distanceKm(mancherialAddress.latitude,mancherialAddress.longitude,store.lat,store.lng)
          })).filter(store=>store.distance<=store.radius)
            .sort((a,b)=>a.distance-b.distance||a.name.localeCompare(b.name));
          let baseline=null;
          let mancherialStoreName='';
          for(const candidate of nearbyMancherialStores){
            let sellable=null;
            for(const [candidateProductId,productRows] of byProduct){
              sellable=productRows.find(row=>
                String(row.store_id)===candidate.id &&
                numeric(row.store_product_available)===1 &&
                (numeric(row.stock_managed)!==1 || numeric(row.available)>=1)
              );
              if(sellable) break;
            }
            if(sellable){
              baseline={
                store_id:candidate.id,
                latitude:mancherialAddress.latitude,
                longitude:mancherialAddress.longitude,
                product_id:sellable.productId,
                category_id:sellable.category_id,
                product_name:sellable.product_name,
                central_price:numeric(sellable.central_price),
                price_override:sellable.price_override==null?null:numeric(sellable.price_override),
                effective_price:numeric(sellable.effective_price)
              };
              mancherialStoreName=candidate.name;
              break;
            }
          }
          if(!baseline) throw new Error('No active store with a visible product and available stock currently serves the Mancherial Head Post Office test address (Indra Nagar / Janmabhoomi Nagar, PIN 504208).');

          // A second fixture exercises a real whole-basket decision. Both live products
          // must have unreserved stock at the same eligible store; no stock is changed.
          const productEntries=[...byProduct.entries()].map(([id,productRows])=>({
            id,categoryId:String(productRows[0]?.category_id||''),
            stockByStore:new Map(productRows.map(row=>[String(row.store_id),numeric(row.available)]))
          }));
          let multiBasket=null;
          for(const origin of stores){
            for(let i=0;i<productEntries.length&&!multiBasket;i++){
              const first=productEntries[i];
              if(!first.categoryId) continue;
              for(let j=i+1;j<productEntries.length;j++){
                const second=productEntries[j];
                if(second.categoryId!==first.categoryId) continue;
                const eligible=stores.map(store=>({
                  store,
                  distance:distanceKm(origin.lat,origin.lng,store.lat,store.lng)
                })).filter(candidate=>
                  candidate.distance<=candidate.store.radius&&
                  (first.stockByStore.get(candidate.store.id)??0)>=1&&
                  (second.stockByStore.get(candidate.store.id)??0)>=1
                ).sort((a,b)=>a.distance-b.distance||a.store.name.localeCompare(b.store.name));
                if(eligible.length){
                  multiBasket={
                    store_id:eligible[0].store.id,
                    latitude:origin.lat,
                    longitude:origin.lng,
                    product_id:first.id,
                    second_product_id:second.id,
                    category_id:first.categoryId
                  };
                  break;
                }
              }
            }
            if(multiBasket)break;
          }

          // Derive a valid map pin that is definitely outside every active store's
          // configured radius. The API returns AREA_UNAVAILABLE before its inventory
          // backfill step when no store is in range, so this production probe is read-only.
          const candidates=[];
          for(const lat of [-75,-45,-15,15,45,75]){
            for(const lng of [-165,-105,-45,15,75,135]) candidates.push({latitude:lat,longitude:lng});
          }
          const outside=candidates.find(point=>stores.every(store=>
            distanceKm(point.latitude,point.longitude,store.lat,store.lng)>store.radius+0.1
          ));
          if(!outside) throw new Error('Could not derive a safe outside-radius production test pin; no outside-area API request will be sent.');

          // Find a point where the closest active store is out of stock and the next
          // stock-capable store is the expected fallback. Keep at least 50m radius margin.
          let fallback=null;
          for(const [productId,productRows] of byProduct){
            const stockByStore=new Map(productRows.map(r=>[String(r.store_id),numeric(r.available)]));
            for(const nearest of stores){
              if((stockByStore.get(nearest.id)??0)>=1) continue;
              for(const candidate of stores){
                if(candidate.id===nearest.id||(stockByStore.get(candidate.id)??0)<1) continue;
                for(let step=1;step<=19;step++){
                  const t=step*0.025;
                  if(t>=0.5) break;
                  const latitude=nearest.lat+(candidate.lat-nearest.lat)*t;
                  const longitude=nearest.lng+(candidate.lng-nearest.lng)*t;
                  const ranked=stores.map(store=>({...store,distance:distanceKm(latitude,longitude,store.lat,store.lng)}))
                    .filter(store=>store.distance<=store.radius-0.05)
                    .sort((a,b)=>a.distance-b.distance||a.name.localeCompare(b.name));
                  const closest=ranked[0];
                  const stocked=ranked.find(store=>(stockByStore.get(store.id)??0)>=1);
                  if(closest?.id===nearest.id&&stocked?.id===candidate.id&&closest.distance<stocked.distance){
                    fallback={latitude,longitude,nearestStoreId:nearest.id,fallbackStoreId:candidate.id,productId};
                    break;
                  }
                }
                if(fallback)break;
              }
              if(fallback)break;
            }
            if(fallback)break;
          }

          const values={
            FRESHWAY_TEST_STORE_ID:baseline.store_id,
            FRESHWAY_TEST_STORE_NAME:mancherialStoreName,
            FRESHWAY_TEST_ADDRESS_LABEL:'Mancherial Head Post Office, Indra Nagar, Janmabhoomi Nagar, Mancherial, Telangana 504208',
            FRESHWAY_TEST_LATITUDE:baseline.latitude,
            FRESHWAY_TEST_LONGITUDE:baseline.longitude,
            FRESHWAY_TEST_PRODUCT_ID:baseline.product_id,
            FRESHWAY_TEST_CATEGORY_ID:baseline.category_id,
            FRESHWAY_TEST_PRODUCT_NAME:baseline.product_name,
            FRESHWAY_TEST_CENTRAL_PRICE:baseline.central_price,
            FRESHWAY_TEST_PRICE_OVERRIDE:baseline.price_override??'',
            FRESHWAY_TEST_EFFECTIVE_PRICE:baseline.effective_price,
            FRESHWAY_TEST_MULTI_BASKET_READY:multiBasket?'true':'false',
            FRESHWAY_TEST_MULTI_BASKET_STORE_ID:multiBasket?.store_id??'',
            FRESHWAY_TEST_MULTI_BASKET_LATITUDE:multiBasket?.latitude??'',
            FRESHWAY_TEST_MULTI_BASKET_LONGITUDE:multiBasket?.longitude??'',
            FRESHWAY_TEST_MULTI_BASKET_PRODUCT_ID:multiBasket?.product_id??'',
            FRESHWAY_TEST_MULTI_BASKET_SECOND_PRODUCT_ID:multiBasket?.second_product_id??'',
            FRESHWAY_TEST_MULTI_BASKET_CATEGORY_ID:multiBasket?.category_id??'',
            FRESHWAY_TEST_FALLBACK_READY:fallback?'true':'false',
            FRESHWAY_TEST_FALLBACK_LATITUDE:fallback?.latitude??'',
            FRESHWAY_TEST_FALLBACK_LONGITUDE:fallback?.longitude??'',
            FRESHWAY_TEST_NEAREST_STORE_ID:fallback?.nearestStoreId??'',
            FRESHWAY_TEST_FALLBACK_STORE_ID:fallback?.fallbackStoreId??'',
            FRESHWAY_TEST_FALLBACK_PRODUCT_ID:fallback?.productId??'',
            FRESHWAY_TEST_OUTSIDE_LATITUDE:outside.latitude,
            FRESHWAY_TEST_OUTSIDE_LONGITUDE:outside.longitude
          };
          for(const [key,value] of Object.entries(values)) fs.appendFileSync(process.env.GITHUB_ENV,key+'='+String(value).replace(/[\r\n]/g,'')+'\n');
          const mancherialRows=rows.filter(row=>String(row.store_id)===baseline.store_id);
          const visibleCustomerRows=mancherialRows.filter(row=>
            numeric(row.product_active)===1&&numeric(row.category_active)===1&&
            numeric(row.store_product_available)===1&&
            (numeric(row.stock_managed)!==1||numeric(row.available_qty)>0)
          );
          const adminExtraRows=mancherialRows.filter(row=>
            numeric(row.product_active)!==1||numeric(row.category_active)!==1
          );
          console.log('MANCHERIAL_STORE_CATALOGUE_AUDIT '+JSON.stringify({
            storeId:baseline.store_id,
            storeName:mancherialStoreName,
            centralActiveProducts:rows.filter(row=>numeric(row.product_active)===1&&numeric(row.category_active)===1).length,
            ownerStoreCatalogueRows:mancherialRows.length,
            hiddenCentralRowsReturnedToOwnerEditor:adminExtraRows.map(row=>({
              id:row.product_id,name:row.product_name,productActive:Number(row.product_active),
              category:row.category_name,categoryActive:Number(row.category_active),
              localShow:Number(row.store_product_available)===1,
              centralPrice:Number(row.central_price),storeOverride:row.price_override,
              effectivePrice:Number(row.effective_price)
            })),
            customerVisibleRows:visibleCustomerRows.map(row=>({
              id:row.product_id,name:row.product_name,
              centralPrice:Number(row.central_price),
              storeOverride:row.price_override==null?null:Number(row.price_override),
              effectivePrice:Number(row.effective_price),
              availableStock:Number(row.available_qty),
              stockManaged:Number(row.stock_managed)===1
            })),
            localOverrides:mancherialRows.filter(row=>row.price_override!==null&&row.price_override!==undefined).map(row=>({
              id:row.product_id,name:row.product_name,
              centralPrice:Number(row.central_price),storeOverride:Number(row.price_override),
              effectivePrice:Number(row.effective_price),isAvailable:Number(row.store_product_available)===1,
              productActive:Number(row.product_active)===1
            }))
          }));
          console.log('Read-only production fixture: Mancherial H.O address resolved to active store '+mancherialStoreName+' ('+baseline.store_id+'); product '+baseline.product_id+'.');
          if(fallback) console.log('Read-only two-store fallback fixture found: nearest store '+fallback.nearestStoreId+' lacks stock; next stock-capable store is '+fallback.fallbackStoreId+'.');
          else console.log('No safe overlapping two-store fallback fixture exists in current production data; the dedicated Playwright case will be explicitly skipped.');
          console.log('Derived read-only outside-radius customer test pin from active store radii.');
          if(multiBasket) console.log('Read-only multi-item fixture: two active products share unreserved stock at one eligible store '+multiBasket.store_id+'.');
          else console.log('No safe same-store two-product fixture exists; multi-item production test will be explicitly skipped.');
          NODE

      - name: Install Playwright dependencies
        working-directory: e2e
        run: npm install

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run customer-only production Playwright tests
        working-directory: e2e
        run: npx playwright test --config=playwright.production.config.js

      - name: Upload customer browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: freshway-production-customer-playwright
          path: e2e/test-results/production/
          if-no-files-found: warn
          retention-days: 7
