name: FreshWay production customer Playwright

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-customer-playwright.yml'
      - 'e2e/playwright.production.config.js'
      - 'e2e/production/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freshway-production-customer-playwright
  cancel-in-progress: false

jobs:
  production-customer:
    name: Customer-only production browser tests
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FRESHWAY_PRODUCTION_URL: https://fwcoldpressed.in
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Worker dependencies
        working-directory: worker
        run: npm install

      - name: Find real production store and stocked product (read-only)
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Production D1 read credentials are missing. No production data was changed."
            exit 1
          fi
          npx wrangler d1 execute freshway --remote --config wrangler.jsonc --command "WITH reserved AS (SELECT store_id,product_id,SUM(qty) qty FROM delivery_store_inventory_reservations WHERE status IN ('reserved','conflict') GROUP BY store_id,product_id), eligible AS (SELECT s.id store_id,s.name store_name,s.latitude,s.longitude,p.id product_id,p.category_id,MAX(0,i.stock_quantity-COALESCE(r.qty,0)) available_qty FROM delivery_stores s JOIN delivery_store_inventory i ON i.store_id=s.id JOIN products p ON p.id=i.product_id AND p.active=1 AND p.stock_managed=1 JOIN categories c ON c.id=p.category_id AND c.active=1 LEFT JOIN reserved r ON r.store_id=s.id AND r.product_id=p.id WHERE s.is_active=1 AND s.latitude IS NOT NULL AND s.longitude IS NOT NULL AND NOT (s.latitude=0 AND s.longitude=0)), unique_products AS (SELECT product_id FROM eligible WHERE available_qty>0 GROUP BY product_id HAVING COUNT(*)=1) SELECT e.store_id,e.latitude,e.longitude,e.product_id,e.category_id FROM eligible e JOIN unique_products u ON u.product_id=e.product_id WHERE e.available_qty>0 ORDER BY e.store_name,e.product_id LIMIT 1" --json > "$RUNNER_TEMP/freshway-store-fixture.json"
          node --input-type=module - "$RUNNER_TEMP/freshway-store-fixture.json" "$GITHUB_ENV" <<'NODE'
          import fs from 'node:fs';
          const raw=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const batches=Array.isArray(raw)?raw:[raw];
          const rows=batches.flatMap(x=>Array.isArray(x?.results)?x.results:[]);
          const row=rows[0];
          if(!row) {
            console.error('No active store has a live product with unreserved stock and valid map coordinates.');
            process.exit(1);
          }
          const values={
            FRESHWAY_TEST_STORE_ID:row.store_id,
            FRESHWAY_TEST_LATITUDE:row.latitude,
            FRESHWAY_TEST_LONGITUDE:row.longitude,
            FRESHWAY_TEST_PRODUCT_ID:row.product_id,
            FRESHWAY_TEST_CATEGORY_ID:row.category_id
          };
          for(const [key,value] of Object.entries(values)) {
            if(value===undefined||value===null||String(value)==='') throw new Error('Missing production fixture field: '+key);
            fs.appendFileSync(process.env.GITHUB_ENV,key+'='+String(value).replace(/[\r\n]/g,'')+'\n');
          }
          console.log('Selected one active store and a uniquely stocked live product. Only read-only production data was queried.');
          NODE

      - name: Install Playwright dependencies
        working-directory: e2e
        run: npm install

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run customer-only production Playwright tests
        working-directory: e2e
        run: npx playwright test --config=playwright.production.config.js

      - name: Upload customer browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: freshway-production-customer-playwright
          path: e2e/test-results/production/
          if-no-files-found: warn
          retention-days: 7
