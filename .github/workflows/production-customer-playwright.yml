name: FreshWay production customer + Owner lifecycle tests

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-customer-playwright.yml'
      - 'e2e/playwright.production.config.js'
      - 'e2e/production/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freshway-production-customer-playwright
  cancel-in-progress: false

jobs:
  production-browser:
    name: Production customer and Owner integration
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      FRESHWAY_PRODUCTION_URL: https://fwcoldpressed.in
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Worker dependencies
        working-directory: worker
        run: npm install

      - name: Require Owner access before creating production test data
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_TOKEN:-}" ]; then
            echo "::error::The production GitHub Actions environment must provide ADMIN_TOKEN. No customer, order or inventory data has been changed."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Production D1 read/cleanup credentials are missing. No customer, order or inventory data has been changed."
            exit 1
          fi
          echo "Owner and scoped production D1 credentials are present."

      - name: Find a one-unit production inventory fixture (read-only)
        id: fixture
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute freshway --remote --config wrangler.jsonc --command "WITH reserved AS (SELECT store_id,product_id,SUM(qty) qty FROM delivery_store_inventory_reservations WHERE status IN ('reserved','conflict') GROUP BY store_id,product_id), eligible AS (SELECT s.id store_id,s.name store_name,s.latitude,s.longitude,p.id product_id,p.category_id,MAX(0,i.stock_quantity-COALESCE(r.qty,0)) available_qty FROM delivery_stores s JOIN delivery_store_inventory i ON i.store_id=s.id JOIN products p ON p.id=i.product_id AND p.active=1 AND p.stock_managed=1 JOIN categories c ON c.id=p.category_id AND c.active=1 LEFT JOIN reserved r ON r.store_id=s.id AND r.product_id=p.id WHERE s.is_active=1 AND s.latitude IS NOT NULL AND s.longitude IS NOT NULL AND NOT (s.latitude=0 AND s.longitude=0)), unique_products AS (SELECT product_id FROM eligible WHERE available_qty=1 GROUP BY product_id HAVING COUNT(*)=1) SELECT e.store_id,e.latitude,e.longitude,e.product_id,e.category_id FROM eligible e JOIN unique_products u ON u.product_id=e.product_id WHERE e.available_qty=1 ORDER BY e.store_name,e.product_id LIMIT 1" --json > "$RUNNER_TEMP/freshway-store-fixture.json"
          node --input-type=module - "$RUNNER_TEMP/freshway-store-fixture.json" "$GITHUB_ENV" <<'NODE'
          import fs from 'node:fs';
          const raw=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const batches=Array.isArray(raw)?raw:[raw];
          const rows=batches.flatMap(x=>Array.isArray(x?.results)?x.results:[]);
          const row=rows[0];
          if(!row) {
            console.error('No active store currently has a product with exactly one unreserved unit and valid coordinates. The lifecycle test stopped before creating any customer or order.');
            process.exit(1);
          }
          const values={
            FRESHWAY_TEST_STORE_ID:row.store_id,
            FRESHWAY_TEST_LATITUDE:row.latitude,
            FRESHWAY_TEST_LONGITUDE:row.longitude,
            FRESHWAY_TEST_PRODUCT_ID:row.product_id,
            FRESHWAY_TEST_CATEGORY_ID:row.category_id
          };
          for(const [key,value] of Object.entries(values)) {
            if(value===undefined||value===null||String(value)==='') throw new Error('Missing production fixture field: '+key);
            fs.appendFileSync(process.env.GITHUB_ENV,key+'='+String(value).replace(/[\r\n]/g,'')+'\n');
          }
          console.log('A real active store and a single available unit were selected for a controlled reservation/cancellation test.');
          NODE

      - name: Allocate a run-scoped synthetic customer phone
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          test_phone="0${GITHUB_RUN_ID: -8}${GITHUB_RUN_ATTEMPT: -1}"
          if ! [[ "$test_phone" =~ ^0[0-9]{9}$ ]]; then
            echo "::error::Could not construct the isolated synthetic test phone."
            exit 1
          fi
          npx wrangler d1 execute freshway --remote --config wrangler.jsonc --command "SELECT id FROM customers WHERE phone='91${test_phone}' LIMIT 1" --json > "$RUNNER_TEMP/freshway-phone-collision.json"
          node --input-type=module - "$RUNNER_TEMP/freshway-phone-collision.json" "$GITHUB_ENV" "$test_phone" <<'NODE'
          import fs from 'node:fs';
          const raw=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const batches=Array.isArray(raw)?raw:[raw];
          const rows=batches.flatMap(x=>Array.isArray(x?.results)?x.results:[]);
          if(rows.length)throw new Error('The run-scoped synthetic test phone already exists in D1. Stopping without touching that account.');
          fs.appendFileSync(process.argv[3],'FRESHWAY_TEST_PHONE='+process.argv[4]+'\n');
          console.log('A non-customer synthetic test phone was verified unused before account creation.');
          NODE

      - name: Install Playwright dependencies
        working-directory: e2e
        run: npm install

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run production customer and Owner Playwright lifecycle tests
        working-directory: e2e
        run: npx playwright test --config=playwright.production.config.js

      - name: Always classify and cancel any production test order
        if: always()
        working-directory: e2e
        run: node production/cleanup-order-lifecycle.mjs

      - name: Soft-delete the isolated production test customer
        if: always() && env.FRESHWAY_TEST_CUSTOMER_ID != ''
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          if [ "${FRESHWAY_TEST_CLEANUP_VERIFIED:-}" != "true" ]; then
            echo "::error::Owner cancellation and stock restoration were not verified. The temporary customer was left intact for investigation."
            exit 1
          fi
          customer_id="${FRESHWAY_TEST_CUSTOMER_ID}"
          test_phone="${FRESHWAY_TEST_PHONE:-}"
          test_name="FRESHWAY AUTOMATED TEST ${GITHUB_RUN_ID}"
          if ! [[ "$customer_id" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]] || ! [[ "$test_phone" =~ ^0[0-9]{9}$ ]]; then
            echo "::error::Temporary customer identity did not pass cleanup validation."
            exit 1
          fi
          sql="UPDATE customers SET deleted_at=CURRENT_TIMESTAMP,auth_version=COALESCE(auth_version,0)+1,updated_at=CURRENT_TIMESTAMP WHERE id='${customer_id}' AND phone='91${test_phone}' AND name='${test_name}' AND deleted_at IS NULL"
          npx wrangler d1 execute freshway --remote --config wrangler.jsonc --command "$sql" --json > "$RUNNER_TEMP/freshway-customer-soft-delete.json"
          verify_sql="SELECT CASE WHEN deleted_at IS NOT NULL THEN 1 ELSE 0 END AS soft_deleted FROM customers WHERE id='${customer_id}' AND phone='91${test_phone}' AND name='${test_name}' LIMIT 1"
          npx wrangler d1 execute freshway --remote --config wrangler.jsonc --command "$verify_sql" --json > "$RUNNER_TEMP/freshway-customer-soft-delete-verify.json"
          node --input-type=module - "$RUNNER_TEMP/freshway-customer-soft-delete-verify.json" <<'NODE'
          import fs from 'node:fs';
          const raw=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const batches=Array.isArray(raw)?raw:[raw];
          const rows=batches.flatMap(x=>Array.isArray(x?.results)?x.results:[]);
          if(Number(rows[0]?.soft_deleted)!==1)throw new Error('Could not verify that the isolated production test customer was soft-deleted.');
          console.log('The unique automated test customer is soft-deleted. The cancelled test order and its audit trail remain in the Owner test-orders area.');
          NODE

      - name: Upload production browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: freshway-production-customer-owner-lifecycle
          path: e2e/test-results/production/
          if-no-files-found: warn
          retention-days: 7
