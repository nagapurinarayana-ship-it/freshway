name: FreshWay Owner admin read-only performance audit

on:
  push:
    branches:
      - 'perf-audit/**'
    paths:
      - '.github/workflows/production-performance-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freshway-owner-admin-performance-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Owner admin Lighthouse + low-impact GET probe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: https://fwcoldpressed.in
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Prepare report directory
        run: mkdir -p reports

      - name: Run Lighthouse mobile audit
        run: |
          npx --yes lighthouse@12.8.2 "$BASE_URL/admin.html" \
            --chrome-path="${{ steps.chrome.outputs.chrome-path }}" \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --form-factor=mobile \
            --throttling-method=simulate \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json \
            --output-path=reports/lighthouse-mobile.json \
            --quiet

      - name: Run Lighthouse desktop audit
        run: |
          npx --yes lighthouse@12.8.2 "$BASE_URL/admin.html" \
            --chrome-path="${{ steps.chrome.outputs.chrome-path }}" \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --preset=desktop \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json \
            --output-path=reports/lighthouse-desktop.json \
            --quiet

      - name: Summarize Lighthouse results
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import fs from 'node:fs';
          const format = (path, label) => {
            const r = JSON.parse(fs.readFileSync(path, 'utf8'));
            const score = key => {
              const value = r.categories?.[key]?.score;
              return value == null ? 'n/a' : Math.round(value * 100);
            };
            const ms = key => {
              const value = r.audits?.[key]?.numericValue;
              if (value == null) return 'n/a';
              return key === 'cumulative-layout-shift' ? Number(value.toFixed(3)).toString() : `${(value / 1000).toFixed(2)} s`;
            };
            return {
              label,
              performance: score('performance'),
              accessibility: score('accessibility'),
              bestPractices: score('best-practices'),
              seo: score('seo'),
              fcp: ms('first-contentful-paint'),
              lcp: ms('largest-contentful-paint'),
              cls: ms('cumulative-layout-shift'),
              tbt: ms('total-blocking-time'),
              speedIndex: ms('speed-index')
            };
          };
          const rows = [
            format('reports/lighthouse-mobile.json', 'Mobile'),
            format('reports/lighthouse-desktop.json', 'Desktop')
          ];
          fs.writeFileSync('reports/lighthouse-summary.json', JSON.stringify(rows, null, 2));
          console.log('## Lighthouse scores');
          console.log('| Profile | Performance | Accessibility | Best practices | SEO | FCP | LCP | CLS | TBT | Speed Index |');
          console.log('|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|');
          for (const r of rows) {
            console.log(`|${r.label}|${r.performance}|${r.accessibility}|${r.bestPractices}|${r.seo}|${r.fcp}|${r.lcp}|${r.cls}|${r.tbt}|${r.speedIndex}|`);
          }
          console.log('');
          console.log('Lab results are snapshots from this runner; compare repeat runs before treating small differences as regressions.');
          NODE

      - name: Run controlled read-only production GET probe
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { performance } from 'node:perf_hooks';

          const base = process.env.BASE_URL.replace(/\/$/, '');
          const durationMs = 30_000;
          const intervalMs = 1_000;
          const concurrency = 3;
          const samples = [];
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const startedAt = new Date().toISOString();

          async function worker(id) {
            const deadline = Date.now() + durationMs;
            let requestNumber = 0;
            while (Date.now() < deadline) {
              const path = requestNumber++ % 2 === 0 ? '/' : '/api/health';
              const start = performance.now();
              let status = 0;
              let error = null;
              let cfCacheStatus = null;
              try {
                const response = await fetch(base + path, {
                  method: 'GET',
                  redirect: 'follow',
                  signal: AbortSignal.timeout(12_000),
                  headers: { 'user-agent': 'FreshWay-ReadOnly-Performance-Audit/1.0' }
                });
                status = response.status;
                cfCacheStatus = response.headers.get('cf-cache-status');
                const body = await response.text();
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                if (path === '/api/health') {
                  const health = JSON.parse(body);
                  if (health.ok !== true) throw new Error('Health endpoint did not return ok:true');
                }
              } catch (e) {
                error = e instanceof Error ? e.message : String(e);
              }
              samples.push({
                worker: id,
                path,
                status,
                elapsedMs: Math.round(performance.now() - start),
                cfCacheStatus,
                error
              });
              await sleep(Math.max(0, intervalMs - (performance.now() - start)));
            }
          }

          await Promise.all(Array.from({ length: concurrency }, (_, i) => worker(i + 1)));
          const elapsedMs = Date.now() - Date.parse(startedAt);
          const sorted = samples.map(s => s.elapsedMs).sort((a, b) => a - b);
          const percentile = p => sorted.length ? sorted[Math.min(sorted.length - 1, Math.ceil(sorted.length * p) - 1)] : null;
          const byPath = Object.fromEntries([...new Set(samples.map(s => s.path))].map(path => {
            const rows = samples.filter(s => s.path === path);
            const latencies = rows.map(s => s.elapsedMs).sort((a, b) => a - b);
            const p = n => latencies.length ? latencies[Math.min(latencies.length - 1, Math.ceil(latencies.length * n) - 1)] : null;
            return [path, {
              requests: rows.length,
              successful: rows.filter(s => s.status >= 200 && s.status < 300 && !s.error).length,
              failed: rows.filter(s => s.error || s.status < 200 || s.status >= 300).length,
              p50Ms: p(0.50),
              p95Ms: p(0.95),
              maxMs: latencies.at(-1) ?? null,
              cfCacheStatuses: [...new Set(rows.map(s => s.cfCacheStatus).filter(Boolean))]
            }];
          }));
          const report = {
            startedAt,
            target: base,
            durationMs: elapsedMs,
            profile: { concurrency, intervalMs, methods: ['GET'], endpoints: ['/', '/api/health'] },
            totalRequests: samples.length,
            requestsPerSecond: Number((samples.length / (elapsedMs / 1000)).toFixed(2)),
            successful: samples.filter(s => s.status >= 200 && s.status < 300 && !s.error).length,
            failed: samples.filter(s => s.error || s.status < 200 || s.status >= 300).length,
            p50Ms: percentile(0.50),
            p95Ms: percentile(0.95),
            maxMs: sorted.at(-1) ?? null,
            byPath,
            errors: samples.filter(s => s.error).slice(0, 20)
          };
          fs.writeFileSync('reports/low-impact-get-probe.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          if (report.failed > 0) process.exitCode = 1;
          NODE

      - name: Upload performance reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: freshway-owner-admin-performance-audit
          path: reports/
          if-no-files-found: warn
          retention-days: 30
