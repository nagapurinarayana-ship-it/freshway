name: Diagnose one account-deletion error reference

on:
  push:
    branches:
      - 'diagnose/**'
    paths:
      - '.github/workflows/diagnose-account-deletion-reference.yml'

permissions:
  contents: read

jobs:
  query-one-reference:
    name: Read-only lookup of one Worker error reference
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker dependencies
        working-directory: worker
        run: npm install --no-audit --no-fund
      - name: Inspect production column constraints (read-only)
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for table in customers addresses orders order_address_snapshots notification_events push_subscriptions account_deletion_requests auth_rate_limits; do
            echo "=== Production column constraints: $table ==="
            npx wrangler d1 execute freshway --remote --config wrangler.jsonc --command "PRAGMA table_info('$table')" --json \
              | node -e 'const fs=require("fs");const raw=fs.readFileSync(0,"utf8");const start=raw.indexOf("{"),end=raw.lastIndexOf("}");if(start<0||end<start)throw Error("Wrangler JSON not found");const x=JSON.parse(raw.slice(start,end+1));const rows=(function walk(v){if(Array.isArray(v)){if(v.some(r=>r&&typeof r==="object"&&"name" in r&&"notnull" in r))return v;for(const e of v){const z=walk(e);if(z)return z}}else if(v&&typeof v==="object"){for(const e of Object.values(v)){const z=walk(e);if(z)return z}}return null})(x);if(!rows)throw Error("PRAGMA rows not found");console.log(JSON.stringify(rows.map(r=>({name:r.name,notnull:r.notnull,pk:r.pk,type:r.type,default:r.dflt_value}))))'
          done
          for sql in \
            "SELECT sql FROM sqlite_master WHERE type='table' AND name='order_address_snapshots'" \
            "PRAGMA foreign_key_list('order_address_snapshots')" \
            "PRAGMA index_list('order_address_snapshots')" \
            "SELECT COUNT(*) AS total_rows, SUM(customer_id IS NULL) AS customer_id_nulls, SUM(address_id IS NULL) AS address_id_nulls, SUM(recipient_name IS NULL) AS recipient_name_nulls, SUM(delivery_phone IS NULL) AS delivery_phone_nulls, SUM(house_flat IS NULL) AS house_flat_nulls, SUM(area IS NULL) AS area_nulls, SUM(city IS NULL) AS city_nulls, SUM(pincode IS NULL) AS pincode_nulls FROM order_address_snapshots"; do
            echo "=== Read-only snapshot schema/data check ==="
            echo "SQL: $sql"
            npx wrangler d1 execute freshway --remote --config wrangler.jsonc --command "$sql" --json \
              | node -e 'const fs=require("fs");const raw=fs.readFileSync(0,"utf8");const start=raw.indexOf("{"),end=raw.lastIndexOf("}");if(start<0||end<start)throw Error("Wrangler JSON not found");const x=JSON.parse(raw.slice(start,end+1));console.log(JSON.stringify(x))'
          done
      - name: Query recent Worker logs for the exact reference
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ERROR_REFERENCE: dd22f017-1999-4e28-9c40-ddc52824caae
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "Cloudflare read credentials are not available to this job."
            exit 1
          fi

          end_ms="$(date -u +%s)000"
          start_ms="$(( $(date -u -d '48 hours ago' +%s) * 1000 ))"
          response_file="$RUNNER_TEMP/worker-observability.json"
          http_code="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/query" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary @- <<JSON
          {
            "queryId": "adhoc-account-deletion-reference",
            "timeframe": {"from": $start_ms, "to": $end_ms},
            "limit": 100,
            "dry": true,
            "parameters": {
              "datasets": ["cloudflare-workers"],
              "filterCombination": "and",
              "needle": {"value": "$ERROR_REFERENCE", "isRegex": false, "matchCase": true},
              "view": "events"
            }
          }
          JSON
          )"
          if [[ "$http_code" -lt 200 || "$http_code" -ge 300 ]]; then
            echo "Cloudflare Observability query returned HTTP $http_code."
            node -e 'const fs=require("fs");try{const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));for(const e of (x.errors||[])) console.log(String(e.message||"Query rejected").slice(0,500));}catch{}' "$response_file"
            exit 1
          fi

          node - "$response_file" "$ERROR_REFERENCE" <<'NODE'
          const fs = require('node:fs');
          const [file, reference] = process.argv.slice(2);
          const result = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (!result.success) {
            console.log('Cloudflare returned an unsuccessful query.');
            for (const error of (result.errors || [])) console.log(String(error.message || 'Query failed').slice(0, 500));
            process.exit(1);
          }
          const events = result.result?.events || [];
          const matches = events.filter(event => JSON.stringify(event).includes(reference)).slice(0, 10);
          console.log('Exact reference matches:', matches.length);
          for (const event of matches) {
            const meta = event.$metadata || {};
            let source = event.source;
            if (typeof source !== 'string') source = JSON.stringify(source ?? {});
            const redact = value => String(value ?? '')
              .replace(/\b\d{10,12}\b/g, '[redacted-phone]')
              .replace(/(?:passcode|password|token|authorization)\s*[:=]\s*[^,}\s]+/ig, '$1=[redacted]');
            console.log(JSON.stringify({
              timestamp: event.timestamp ?? meta.timestamp ?? meta.startTime ?? null,
              service: meta.service ?? meta.cloudService ?? null,
              level: meta.level ?? null,
              requestId: meta.requestId ?? null,
              trigger: meta.trigger ?? null,
              message: redact(meta.message ?? ''),
              error: redact(meta.error ?? ''),
              source: redact(source).slice(0, 5000)
            }));
          }
          if (!matches.length) {
            console.log('No stored Worker log event containing this exact reference was returned for the 48-hour window.');
            console.log('The log may be outside retention, Workers Logs may not have captured it, or the token may not expose this dataset.');
          }
          NODE
