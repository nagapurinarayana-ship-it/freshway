name: FreshWay Android TWA build preflight

on:
  push:
    branches:
      - build/play-store-twa-preflight-20261024
    paths:
      - 'android-twa/**'
      - '.github/workflows/play-store-twa-build-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unsigned-preflight:
    name: Generate and compile Android TWA (unsigned preflight only)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out frozen production baseline
        uses: actions/checkout@v7
        with:
          ref: build/play-store-twa-preflight-20261024

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Play-target SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Run static Android and PWA preflight
        working-directory: android-twa
        run: npm test

      - name: Verify live PWA manifest and PNG payloads
        shell: bash
        run: |
          node <<'NODE'
          const zlib = require('node:zlib');
          const base = 'https://fwcoldpressed.in';
          const parsePng = (buffer, label) => {
            const signature = Buffer.from([137,80,78,71,13,10,26,10]);
            if (buffer.length < 33 || !buffer.subarray(0, 8).equals(signature)) {
              throw new Error(label + ': invalid PNG signature or too short (' + buffer.length + ' bytes)');
            }
            const width = buffer.readUInt32BE(16);
            const height = buffer.readUInt32BE(20);
            const idat = [];
            let pos = 8;
            let sawIend = false;
            while (pos + 12 <= buffer.length) {
              const length = buffer.readUInt32BE(pos);
              const end = pos + 12 + length;
              if (end > buffer.length) throw new Error(label + ': truncated PNG chunk at offset ' + pos);
              const type = buffer.toString('ascii', pos + 4, pos + 8);
              if (type === 'IDAT') idat.push(buffer.subarray(pos + 8, pos + 8 + length));
              pos = end;
              if (type === 'IEND') {
                sawIend = true;
                break;
              }
            }
            if (!sawIend) throw new Error(label + ': missing PNG IEND chunk');
            const pixels = zlib.inflateSync(Buffer.concat(idat));
            if (!width || !height || pixels.length === 0) throw new Error(label + ': invalid dimensions or image data');
            return {width, height, inflatedBytes:pixels.length, bytes:buffer.length};
          };
          (async () => {
            const manifestResponse = await fetch(base + '/manifest.webmanifest', {cache:'no-store'});
            if (!manifestResponse.ok) throw new Error('Live web manifest returned HTTP ' + manifestResponse.status);
            const manifestText = await manifestResponse.text();
            const manifest = JSON.parse(manifestText);
            if (manifest.start_url !== '/' || manifest.scope !== '/' || manifest.display !== 'standalone') {
              throw new Error('Live PWA manifest does not match customer app start URL/scope/display');
            }
            console.log('Live web manifest OK:', manifestResponse.status, manifestResponse.headers.get('content-type'));
            for (const path of ['/icons/icon-512.png', '/icons/icon-512-maskable.png']) {
              const response = await fetch(base + path, {cache:'no-store'});
              if (!response.ok) throw new Error(path + ' returned HTTP ' + response.status);
              const mime = (response.headers.get('content-type') || '').toLowerCase();
              if (!mime.startsWith('image/png')) throw new Error(path + ' returned Content-Type ' + mime);
              const buffer = Buffer.from(await response.arrayBuffer());
              const parsed = parsePng(buffer, path);
              console.log('Live PNG integrity OK:', path, JSON.stringify(parsed));
            }
          })().catch(error => { console.error(error.stack || error); process.exitCode = 1; });
          NODE

      - name: Configure Bubblewrap SDK paths non-interactively
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > "$HOME/.bubblewrap/config.json"
          node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync(process.env.HOME+'/.bubblewrap/config.json','utf8')); if(!c.jdkPath || !c.androidSdkPath) process.exit(1); console.log('Bubblewrap SDK paths configured for this ephemeral runner.')"

      - name: Generate Android project from the checked-in TWA configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-twa/generated
          cp android-twa/twa-manifest.json android-twa/generated/twa-manifest.json
          npx --yes @bubblewrap/cli@1.27.0 update \
            --manifest=./android-twa/generated/twa-manifest.json \
            --directory=./android-twa/generated \
            --skipVersionUpgrade
          test -s android-twa/generated/twa-manifest.json

      - name: Verify generated package identity and target API
        working-directory: android-twa
        run: npm run check:generated

      - name: Run live TWA quality validator
        id: live_validation
        shell: bash
        continue-on-error: true
        run: |
          set +e
          npx --yes @bubblewrap/cli@1.27.0 validate --url=https://fwcoldpressed.in 2>&1 | tee /tmp/freshway-twa-validation.log
          result=${PIPESTATUS[0]}
          if [ "$result" -eq 0 ]; then
            echo "Bubblewrap live validation completed successfully."
            exit 0
          fi
          if grep -Eq '429|Too Many Requests|rate.?limit' /tmp/freshway-twa-validation.log; then
            echo "::warning::Bubblewrap live validation was rate-limited; this is inconclusive, not a pass."
          else
            echo "::warning::Bubblewrap live validation failed; review the complete step output before release."
          fi
          exit "$result"

      - name: Compile unsigned App Bundle for CI verification only
        working-directory: android-twa/generated
        run: npx --yes @bubblewrap/cli@1.27.0 build --skipSigning --skipPwaValidation

      - name: Verify bundle output
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="android-twa/generated/app-release-bundle.aab"
          test -s "$BUNDLE"
          unzip -t "$BUNDLE"
          unzip -l "$BUNDLE" | grep -E 'BundleConfig.pb|base/manifest/AndroidManifest.xml'
          echo "Unsigned compile-preflight bundle exists. It is NOT a Play-uploadable release."

      - name: Upload unsigned compile-preflight bundle
        uses: actions/upload-artifact@v4
        with:
          name: freshway-unsigned-twa-preflight
          path: android-twa/generated/app-release-bundle.aab
          if-no-files-found: error
          retention-days: 7
