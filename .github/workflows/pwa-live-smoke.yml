name: FreshWay live PWA smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pwa-live-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Wait for production deployment
        env:
          BASE_URL: https://freshway-f32.pages.dev
          CUSTOM_DOMAIN_URL: https://fwcoldpressed.in
        run: node pwa-live-smoke.mjs

      # Cloudflare Access protects Pages preview hostnames, so a public
      # runner cannot validate them without a service token. Route/asset mapping
      # is covered by functions/admin-pwa.test.mjs; verify the real deployment
      # on the public custom domain after a main-branch deployment.
      - name: Verify deployed Owner PWA on custom domain
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PREVIEW_BASE_URL: https://fwcoldpressed.in
        run: node pwa-owner-preview-smoke.mjs
