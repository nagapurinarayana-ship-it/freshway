name: FreshWay live PWA smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pwa-live-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The public domains serve main, not pull-request code. Never compare an
      # unmerged branch's asset hashes/versions with a production deployment.
      - name: Wait for production deployment
        if: github.event_name != 'pull_request'
        env:
          BASE_URL: https://freshway-f32.pages.dev
          CUSTOM_DOMAIN_URL: https://fwcoldpressed.in
        run: node pwa-live-smoke.mjs

      - name: Explain deferred PWA production smoke
        if: github.event_name == 'pull_request'
        run: |
          echo "::notice title=Live PWA production smoke deferred::The public domains serve main until this pull request is merged. Static asset version/cache contracts and browser behavior are checked by PR validation; customer and Owner live PWA smoke run after deployment to main."

      - name: Verify deployed Owner PWA on custom domain
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          OWNER_PWA_BASE_URL: https://fwcoldpressed.in
        run: node pwa-owner-live-smoke.mjs
