name: FreshWay live PWA smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pwa-live-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Wait for production deployment
        env:
          BASE_URL: https://freshway-f32.pages.dev
          CUSTOM_DOMAIN_URL: https://fwcoldpressed.in
        run: node pwa-live-smoke.mjs

      - name: Verify Owner PWA preview deployment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PREVIEW_BRANCH: ${{ github.head_ref }}
          PAGES_PROJECT: freshway-f32
        run: |
          branch_slug="$(printf '%s' "$PREVIEW_BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/^-+|-+$//g')"
          export PREVIEW_BASE_URL="https://${branch_slug}.${PAGES_PROJECT}.pages.dev"
          echo "PREVIEW_BASE_URL=$PREVIEW_BASE_URL" >> "$GITHUB_ENV"
          node pwa-owner-preview-smoke.mjs
