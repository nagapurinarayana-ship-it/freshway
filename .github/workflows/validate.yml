name: FreshWay validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Worker dependencies
        working-directory: worker
        run: npm install
      - name: Run automated Worker tests
        working-directory: worker
        run: npm test
      - name: Check browser JavaScript
        run: |
          node --check app.js
          node --check admin.js
          node --check notifications.js
          node --check location.js
          node --check orders-ui.js
          node --check sw.js
      - name: Check Worker JavaScript
        working-directory: worker
        run: |
          node --check src/index.js
          node --check src/secure-index.js
          node --check src/admin-auth.js
      - name: Check D1 schema and migration
        working-directory: worker
        run: |
          test -s schema.sql
          grep -q "delivery_plan" schema.sql
          grep -q "INSERT OR IGNORE INTO products" schema.sql
          test -s migrations/0001_delivery_plan.sql
          grep -q "ALTER TABLE orders ADD COLUMN delivery_plan" migrations/0001_delivery_plan.sql
          test -s migrations/0002_auth_rate_limits.sql
          grep -q "auth_rate_limits" migrations/0002_auth_rate_limits.sql
      - name: Check Worker configuration
        working-directory: worker
        run: node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8')); if(!x.name||!x.main||!x.d1_databases?.[0]?.binding||x.main!=='src/admin-auth.js'||!x.secrets?.required?.includes('CUSTOMER_SESSION_SECRET')||!x.secrets?.required?.includes('ADMIN_SESSION_SECRET')) process.exit(1); console.log('wrangler configuration structure and secure entrypoint OK')"
      - name: Check for committed secret values
        run: |
          ! grep -RInE '(WHATSAPP_ACCESS_TOKEN|VAPID_PRIVATE_KEY|ADMIN_TOKEN|CUSTOMER_SESSION_SECRET|ADMIN_SESSION_SECRET)[[:space:]]*[:=][[:space:]]*[^$\"\047[:space:]]{20,}' --exclude-dir=.git --exclude='api.test.js' . || (echo 'Possible committed secret value found' && exit 1)
      - name: Check test fixtures are non-production values
        run: |
          grep -q "fixture-admin" worker/test/api.test.js
          grep -q "fixture-customer-session" worker/test/api.test.js
