name: FreshWay validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install Worker dependencies
        working-directory: worker
        run: npm install
      - name: Audit Worker dependencies
        working-directory: worker
        run: npm audit --audit-level=high
      - name: Run automated Worker tests
        working-directory: worker
        run: npm test
      - name: Check browser JavaScript
        run: |
          find . -maxdepth 3 -type f -name '*.js' -not -path './node_modules/*' -not -path './worker/node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: Enforce authoritative customer catalogue
        run: |
          node <<'NODE'
          const fs = require('fs');
          const app = fs.readFileSync('app.js', 'utf8');
          const catalogue = fs.readFileSync('frontend/customer/catalogue.js', 'utf8');
          const required = [
            [!app.includes('FALLBACK_PRODUCTS'), 'legacy FALLBACK_PRODUCTS still exists in app.js'],
            [app.includes('window.FreshWayCustomerCatalogue'), 'customer catalogue bridge is missing from app.js'],
            [catalogue.includes('window.FreshWayCustomerCatalogue?.setProducts'), 'server product publication is missing'],
            [catalogue.includes('window.FreshWayCustomerCatalogue?.clear'), 'catalogue failure clear path is missing'],
            [catalogue.includes('role="alert"'), 'catalogue error alert is missing'],
            [catalogue.includes('fwCatalogueRetry'), 'catalogue retry control is missing']
          ];
          const failed = required.find(([ok]) => !ok);
          if (failed) throw new Error(failed[1]);
          console.log('Authoritative customer catalogue contract OK');
          NODE

      - name: Run customer boundary tests
        run: |
          node frontend/customer/view-state.test.js
          node frontend/customer/navigation.test.js
          node admin-navigation.test.js
          node admin-orders.test.js
          node frontend/customer/search.test.js
          node frontend/customer/orders-view.test.js
          node frontend/customer/keyboard.test.js
          node frontend/customer/cart-actions.test.js
          node frontend/customer/cart-bar.test.js
          node frontend/customer/checkout-submit.test.js
          node frontend/customer/catalogue.test.js
          node worker/test/inventory.test.js
          node functions/api-addresses.test.mjs
      - name: Run customer API resilience test
        run: node frontend/customer/api.test.js

      - name: Check PWA direct-install contract
        run: |
          node <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.webmanifest', 'utf8'));
          if (manifest.name !== 'FreshWay' || manifest.short_name !== 'FreshWay') throw new Error('PWA names are invalid');
          if (manifest.id !== '/' || manifest.start_url !== '/' || manifest.scope !== '/' || manifest.display !== 'standalone') throw new Error('PWA identity/display contract is invalid');
          if (manifest.prefer_related_applications === true) throw new Error('PWA must remain independently installable');
          for (const size of ['192x192','512x512']) {
            if (!manifest.icons.some(icon => icon.sizes === size && icon.type === 'image/png')) throw new Error('Missing raster PWA icon ' + size);
          }
          for (const purpose of ['any','maskable']) {
            if (!manifest.icons.some(icon => icon.purpose === purpose && icon.type === 'image/png')) throw new Error('Missing PWA ' + purpose + ' icon');
          }
          for (const file of ['frontend/customer/pwa-install.js','frontend/customer/pwa-install.css','icons/icon-192.png','icons/icon-512.png','icons/icon-192-maskable.png','icons/icon-512-maskable.png','sw.js']) {
            if (!fs.existsSync(file)) throw new Error('Missing PWA asset ' + file);
          }
          const index = fs.readFileSync('index.html', 'utf8');
          const pwa = fs.readFileSync('frontend/customer/pwa-install.js', 'utf8');
          if (!pwa.includes("navigator.serviceWorker.register('/sw.js'")) throw new Error('PWA service worker registration missing');
          if (!pwa.includes("beforeinstallprompt")) throw new Error('Native install prompt handling missing');
          for (const required of ['manifest.webmanifest','pwa-install.css','pwa-install.js']) {
            if (!index.includes(required)) throw new Error('index.html is missing ' + required);
          }
          const sw = fs.readFileSync('sw.js', 'utf8');
          if (!/const CACHE = 'freshway-v[0-9]+'/.test(sw)) throw new Error('Service worker cache version missing');
          for (const icon of ['/icons/icon-192.png','/icons/icon-512.png','/icons/icon-192-maskable.png','/icons/icon-512-maskable.png']) {
            if (!sw.includes(icon)) throw new Error('PWA icon is not cached: ' + icon);
          }
          if (sw.includes(".catch(() => {})")) throw new Error('Service worker install failures must not be silently swallowed');
          if (!sw.includes('const REQUIRED_SHELL')) throw new Error('Service worker critical shell contract missing');
          console.log('PWA direct-install contract OK');
          NODE

      - name: Check SEO and public crawler contract
        run: |
          test -s robots.txt
          test -s sitemap.xml
          grep -qF 'Sitemap: https://freshway-f32.pages.dev/sitemap.xml' robots.txt
          grep -qF '<loc>https://freshway-f32.pages.dev/</loc>' sitemap.xml
          grep -qF 'rel="canonical" href="https://freshway-f32.pages.dev/"' index.html
          grep -qF 'meta name="robots" content="index,follow' index.html
          grep -qF 'property="og:title"' index.html
          grep -qF 'property="og:description"' index.html
          grep -qF 'twitter:card' index.html
          test -s frontend/customer/seo.js
          grep -qF "FreshWaySeo" frontend/customer/seo.js
          grep -qF "afterView:name=>window.FreshWaySeo?.setView(name)" app.js
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html','utf8');
          const schema = html.includes('application/ld+json');
          if (!schema) throw new Error('Homepage JSON-LD bootstrap is missing');
          const seo = fs.readFileSync('frontend/customer/seo.js','utf8');
          for (const required of ["'@type':'Organization'","'@type':'WebSite'","noindex,follow","index,follow"]) {
            if (!seo.includes(required)) throw new Error('SEO boundary is missing ' + required);
          }
          console.log('SEO and public crawler contract OK');
          NODE

      - name: Check security and accessibility baseline
        run: |
          test -s _headers
          grep -qF 'X-Content-Type-Options: nosniff' _headers
          grep -qF 'Referrer-Policy: strict-origin-when-cross-origin' _headers
          grep -qF 'X-Frame-Options: SAMEORIGIN' _headers
          grep -qF 'X-Robots-Tag: noindex, nofollow' _headers
          grep -qF 'class="skip-link" href="#main-content"' index.html
          grep -qF '<main id="main-content">' index.html
          grep -qF '.skip-link:focus-visible' styles.css
          grep -qF 'button:focus-visible' styles.css
          grep -qF 'aria-label="Search products"' index.html
          echo 'Security and accessibility baseline OK'

      - name: Check critical frontend asset budgets
        run: |
          test "$(wc -c < index.html)" -le 20000
          test "$(wc -c < styles.css)" -le 25000
          test "$(wc -c < app.js)" -le 12000
          test "$(wc -c < frontend/customer/pwa-install.js)" -le 8000
          test "$(wc -c < frontend/customer/seo.js)" -le 6000
          test "$(wc -c < sw.js)" -le 6000
          echo 'Critical frontend asset budgets OK'

      - name: Check customer module wiring
        run: |
          for module in api storage catalogue-cart orders orders-data orders-view checkout checkout-submit profile address address-flow confirmation order-display cart-view feedback product-view navigation modal account-actions view-state search keyboard cart-actions cart-bar; do
            test -s "frontend/customer/$module.js"
          done
          grep -qF 'FreshWayCustomerAPI' app.js
          grep -qF 'FreshWayCustomerStorage' app.js
          grep -qF 'FreshWayCatalogueCart' app.js
          grep -qF 'FreshWayCustomerOrdersData' app.js
          grep -qF 'FreshWayCustomerCheckoutSubmit' app.js
          grep -qF 'checkoutSubmit.bind()' app.js
          grep -qF 'frontend/customer/checkout-submit.js' index.html
      - name: Check backend feature boundaries
        run: |
          grep -qF "from './admin-orders.js'" worker/src/admin-data.js
          grep -qF "from './admin-reports.js'" worker/src/admin-data.js
          grep -qF "from './admin-customers.js'" worker/src/admin-data.js
          grep -qF "from './admin-products.js'" worker/src/admin-data.js
          grep -qF "from './admin-notifications.js'" worker/src/admin-auth.js
          grep -qF "from './admin-response.js'" worker/src/admin-auth.js
          grep -qF 'export async function notifyOrderChange' worker/src/admin-notifications.js
          grep -qF 'export async function normalizeOwnerResponse' worker/src/admin-response.js
          ! grep -qF "from 'web-push'" worker/src/admin-auth.js
      - name: Check canonical Worker boundaries
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const fail = message => { console.error(`CANONICAL BOUNDARY FAILURE: ${message}`); process.exit(1); };

          const wrangler = JSON.parse(fs.readFileSync('worker/wrangler.jsonc', 'utf8'));
          if (wrangler.main !== 'src/admin-auth.js') fail(`wrangler main is ${wrangler.main}`);

          const passcodeAuth = fs.readFileSync('worker/src/passcode-auth.js', 'utf8');
          if (!passcodeAuth.includes("from './index.js'")) fail('passcode-auth.js no longer wraps index.js');

          const adminDir = 'worker/src';
          const adminFiles = fs.readdirSync(adminDir).filter(name => /^admin-.*\.js$/.test(name));
          for (const name of adminFiles) {
            const source = fs.readFileSync(path.join(adminDir, name), 'utf8');
            if (source.includes("from './index.js'") || source.includes("require('./index.js')") || source.includes('require("./index.js")')) {
              fail(`forbidden index.js dependency in ${name}`);
            }
          }

          const architecture = fs.readFileSync('ARCHITECTURE.md', 'utf8').toLowerCase();
          for (const value of [
            'passcode-auth.js',
            'index.js',
            'compatibility/data layer',
            'new owner lifecycle/business logic',
            'admin-orders.js',
            'admin-data.js'
          ]) {
            if (!architecture.includes(value)) fail(`architecture rule is missing ${value}`);
          }

          const readme = fs.readFileSync('README.md', 'utf8').toLowerCase();
          for (const value of [
            'delivery_status', 'new', 'confirmed', 'processing', 'ready',
            'out for delivery', 'delivered', 'cancelled', 'not collected',
            'collected', 'refunded'
          ]) {
            if (!readme.includes(value)) fail(`README is missing ${value}`);
          }

          const canonicalLifecycle = fs.readFileSync('owner-lifecycle.js', 'utf8');
          if (!canonicalLifecycle.includes('function renderLifecycle')) fail('canonical owner lifecycle renderer is missing');
          if (!canonicalLifecycle.includes('function queueSave')) fail('canonical owner lifecycle autosave queue is missing');
          if (!canonicalLifecycle.includes('const allStatuses')) fail('canonical owner status options are missing');
          if (!canonicalLifecycle.includes('const allPayments')) fail('canonical owner payment options are missing');

          const legacyLifecycle = fs.readFileSync('frontend/admin/owner-lifecycle-autosave.js', 'utf8');
          for (const forbidden of ['data-fw-life-action', 'data-fw-life-map', 'addEventListener', 'modalBody']) {
            if (legacyLifecycle.includes(forbidden)) fail(`duplicate lifecycle controller detected: ${forbidden}`);
          }

          console.log(`canonical Worker boundaries OK (${adminFiles.length} admin modules checked)`);
          console.log('single Owner lifecycle controller OK');
          NODE
      - name: Check D1 schema and migrations
        working-directory: worker
        run: |
          test -s schema.sql
          grep -q 'delivery_plan' schema.sql
          grep -q 'client_order_id' schema.sql
          for migration in migrations/*.sql; do test -s "$migration"; done
          if find migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sed -E 's/^([0-9]+)_.*/\1/' | sort | uniq -d | grep -q .; then exit 1; fi
          test "$(find migrations -maxdepth 1 -type f -name '*.sql' | wc -l)" -ge 1
          test -s migrations/0011_order_payment_statuses.sql
          test -s migrations/0012_catalogue_categories.sql
          test -s migrations/0013_inventory_stock.sql
          grep -q 'stock_managed' schema.sql
          grep -q 'stock_quantity' schema.sql
          grep -q 'stock_reserved_qty' schema.sql
          grep -q 'stock_managed' migrations/0013_inventory_stock.sql
          grep -q 'stock_reserved_qty' migrations/0013_inventory_stock.sql
          grep -q 'client_order_id' migrations/0002_order_idempotency.sql
          grep -q 'auth_rate_limits' migrations/0003_auth_rate_limits.sql
          grep -q 'CREATE UNIQUE INDEX' migrations/0004_unique_customer_phone.sql
          grep -q 'passcode_hash' migrations/0005_customer_passcode_auth.sql
          grep -q 'Out for Delivery' migrations/0007_owner_order_lifecycle.sql
          grep -q "Not Collected" migrations/0011_order_payment_statuses.sql
          grep -q 'category_id' migrations/0012_catalogue_categories.sql
      - name: Check Worker configuration
        working-directory: worker
        run: node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8')); const required=['ADMIN_TOKEN','CUSTOMER_SESSION_SECRET','ADMIN_SESSION_SECRET']; if(!x.name||!x.main||!x.d1_databases?.[0]?.binding||x.main!=='src/admin-auth.js'||required.some(s=>!x.secrets?.required?.includes(s))||x.vars?.OTP_PROVIDER||x.secrets?.optional?.length) process.exit(1); console.log('wrangler configuration OK')"
      - name: Check for committed secret values
        run: |
          ! grep -RInE '(WHATSAPP_ACCESS_TOKEN|VAPID_PRIVATE_KEY|ADMIN_TOKEN|CUSTOMER_SESSION_SECRET|ADMIN_SESSION_SECRET|TWILIO_ACCOUNT_SID|TWILIO_AUTH_TOKEN|TWILIO_VERIFY_SERVICE_SID)[[:space:]]*[:=][[:space:]]*[^$\"\047[:space:]]{20,}' --exclude-dir=.git --exclude='api.test.js' --exclude='secure-identity.test.js' .
      - name: Check test fixtures are non-production values
        run: |
          grep -qF 'fixture-admin' worker/test/api.test.js
          grep -qF 'fixture-customer-session' worker/test/api.test.js
