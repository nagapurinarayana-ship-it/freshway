name: FreshWay validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Worker dependencies
        working-directory: worker
        run: npm install
      - name: Check browser JavaScript
        run: |
          node --check app.js
          node --check admin.js
          node --check notifications.js
          node --check sw.js
      - name: Check Worker JavaScript
        working-directory: worker
        run: node --check src/index.js
      - name: Check D1 seed/schema is present
        working-directory: worker
        run: test -s schema.sql && grep -q "INSERT OR IGNORE INTO products" schema.sql
      - name: Check Worker configuration
        working-directory: worker
        run: node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8')); if(!x.name||!x.main||!x.d1_databases?.[0]?.binding) process.exit(1); console.log('wrangler configuration structure OK')"
