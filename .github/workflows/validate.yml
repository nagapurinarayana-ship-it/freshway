name: FreshWay validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Worker dependencies
        working-directory: worker
        run: npm install
      - name: Run automated Worker tests
        working-directory: worker
        run: npm test
      - name: Check browser JavaScript
        run: |
          node --check app.js
          node --check admin.js
          node --check owner-lifecycle.js
          node --check owner-address-final.js
          node --check notifications.js
          node --check location.js
          node --check orders-ui.js
          node --check address-system-final.js
          node --check address-fix.js
          node --check frontend/customer/api.js
          node --check frontend/customer/storage.js
          node --check frontend/customer/catalogue-cart.js
          node --check frontend/customer/orders.js
          node --check frontend/customer/orders-view.js
          node --check frontend/customer/checkout.js
          node --check frontend/customer/profile.js
          node --check frontend/customer/address.js
          node --check frontend/customer/address-flow.js
          node --check frontend/customer/confirmation.js
          node --check frontend/customer/order-display.js
          node --check frontend/customer/cart-view.js
          node --check frontend/customer/feedback.js
          node --check frontend/customer/product-view.js
          node --check frontend/customer/navigation.js
          node --check frontend/customer/modal.js
          node --check frontend/customer/account-actions.js
          node --check frontend/customer/view-state.js
          node --check frontend/customer/search.js
          node --check frontend/customer/keyboard.js
          node --check frontend/customer/cart-actions.js
          node --check frontend/customer/cart-bar.js
          node --check frontend/customer/view-state.test.js
          node --check frontend/customer/search.test.js
          node --check frontend/customer/orders-view.test.js
          node --check frontend/customer/keyboard.test.js
          node --check frontend/customer/cart-actions.test.js
          node --check frontend/customer/cart-bar.test.js
          node --check sw.js
      - name: Run customer view-state tests
        run: node frontend/customer/view-state.test.js
      - name: Run customer search tests
        run: node frontend/customer/search.test.js
      - name: Run customer orders-view tests
        run: node frontend/customer/orders-view.test.js
      - name: Run customer keyboard tests
        run: node frontend/customer/keyboard.test.js
      - name: Run customer cart-actions tests
        run: node frontend/customer/cart-actions.test.js
      - name: Run customer cart-bar tests
        run: node frontend/customer/cart-bar.test.js
      - name: Check Worker JavaScript
        working-directory: worker
        run: |
          node --check src/index.js
          node --check src/secure-index.js
          node --check src/passcode-auth.js
          node --check src/admin-auth.js
          node --check src/admin-data.js
          node --check src/admin-orders.js
          node --check src/admin-customers.js
          node --check src/admin-reports.js
          node --check src/admin-products.js
          node --check src/admin-shared.js
          node --check src/admin-notifications.js
          node --check src/admin-response.js
          node --check src/address-api.js
      - name: Enforce frontend feature boundaries
        run: |
          grep -q "window.FreshWayCustomerAPI" frontend/customer/api.js
          grep -q "credentials:'include'" frontend/customer/api.js
          grep -q "window.FreshWayCustomerStorage" frontend/customer/storage.js
          grep -q "freshway-state-v2" frontend/customer/storage.js
          grep -q "window.FreshWayCatalogueCart" frontend/customer/catalogue-cart.js
          grep -q "const catalogueCart=window.FreshWayCatalogueCart" app.js
          grep -q "const cartItems=()=>catalogueCart.items(state,PRODUCTS)" app.js
          grep -q "const cartTotal=()=>catalogueCart.total(state,PRODUCTS)" app.js
          grep -q "const cartCount=()=>catalogueCart.count(state,PRODUCTS)" app.js
          grep -q "const customerAPI=window.FreshWayCustomerAPI" app.js
          grep -q "const customerStorage=window.FreshWayCustomerStorage" app.js
          grep -q "const api=customerAPI.request" app.js
          grep -q "const save=()=>customerStorage.save(state)" app.js
          grep -q "window.FreshWayCustomerOrders" frontend/customer/orders.js
          grep -q "const customerOrders=window.FreshWayCustomerOrders" app.js
          grep -q "customerOrders.normalize" app.js
          grep -q "customerOrders.latest" app.js
          grep -q "customerOrders.statusLabel" app.js
          grep -q "window.FreshWayCustomerOrdersView" frontend/customer/orders-view.js
          grep -q "const customerOrdersView=window.FreshWayCustomerOrdersView" app.js
          grep -q "customerOrdersView.render(document,list" app.js
          grep -q "frontend/customer/orders-view.js" index.html
          ! grep -q "function renderOrders(list=customerOrders.normalize" app.js
          grep -q "window.FreshWayCustomerCheckout" frontend/customer/checkout.js
          grep -q "frontend/customer/checkout.js" index.html
          grep -q "const customerCheckout=window.FreshWayCustomerCheckout" app.js
          grep -q "customerCheckout.validate(name,phone,address)" app.js
          grep -q "customerCheckout.payload(data,address" app.js
          grep -q "customerCheckout.clientOrderId(data,address" app.js
          grep -q "window.FreshWayCustomerProfile" frontend/customer/profile.js
          grep -q "const customerProfile=window.FreshWayCustomerProfile" app.js
          grep -q "customerProfile.savedAddress" app.js
          grep -q "customerProfile.name(state.profile,last)" app.js
          grep -q "customerProfile.phone(state.profile,last)" app.js
          grep -q "customerProfile.displayAddress(state.profile)" app.js
          grep -q "customerProfile.homeAddress(state.profile)" app.js
          grep -q "frontend/customer/profile.js" index.html
          grep -q "window.FreshWayCustomerAddress" frontend/customer/address.js
          grep -q "const customerAddress=window.FreshWayCustomerAddress" app.js
          grep -q "customerAddress.normalize" app.js
          grep -q "customerAddress.format(address)" app.js
          grep -q "frontend/customer/address.js" index.html
          grep -q "window.FreshWayCustomerConfirmation" frontend/customer/confirmation.js
          grep -q "frontend/customer/confirmation.js" index.html
          grep -q "const customerConfirmation=window.FreshWayCustomerConfirmation" app.js
          grep -q "customerConfirmation.show(order" app.js
          grep -q "window.FreshWayCustomerOrderDisplay" frontend/customer/order-display.js
          grep -q "const customerOrderDisplay=window.FreshWayCustomerOrderDisplay" app.js
          grep -q "customerOrderDisplay.formatDate" app.js
          grep -q "customerOrderDisplay.planText" app.js
          grep -q "customerOrderDisplay.money" app.js
          grep -q "const money=customerOrderDisplay.money" app.js
          grep -q "frontend/customer/order-display.js" index.html
          grep -q "window.FreshWayCustomerCartView" frontend/customer/cart-view.js
          grep -q "const customerCartView=window.FreshWayCustomerCartView" app.js
          grep -q "customerCartView.render(cartItems(),cartTotal()" app.js
          grep -q "frontend/customer/cart-view.js" index.html
          grep -q "window.FreshWayCustomerFeedback" frontend/customer/feedback.js
          grep -q "const customerFeedback=window.FreshWayCustomerFeedback" app.js
          grep -q "customerFeedback.show(document,msg)" app.js
          grep -q "frontend/customer/feedback.js" index.html
          grep -q "window.FreshWayCustomerProductView" frontend/customer/product-view.js
          grep -q "const customerProductView=window.FreshWayCustomerProductView" app.js
          grep -q "customerProductView.render(PRODUCTS,state,filter" app.js
          grep -q "frontend/customer/product-view.js" index.html
          grep -q "window.FreshWayCustomerNavigation" frontend/customer/navigation.js
          grep -q "const customerNavigation=window.FreshWayCustomerNavigation" app.js
          grep -q "const navigation=customerNavigation.create" app.js
          grep -q "function setView(name){navigation.setView(name)}" app.js
          grep -q "frontend/customer/navigation.js" index.html
          grep -q "window.FreshWayCustomerModal" frontend/customer/modal.js
          grep -q "const customerModal=window.FreshWayCustomerModal" app.js
          grep -q "customerModal.open(document)" app.js
          grep -q "customerModal.close(document)" app.js
          grep -q "window.FreshWayCustomerViewState" frontend/customer/view-state.js
          grep -q "freshway-current-view-v1" frontend/customer/view-state.js
          grep -q "window.FreshWayCustomerSearch" frontend/customer/search.js
          grep -q "const customerSearch=window.FreshWayCustomerSearch" app.js
          grep -q "customerSearch.bind({document,render:renderProducts})" app.js
          grep -q "frontend/customer/search.js" index.html
          grep -q "window.FreshWayCustomerKeyboard" frontend/customer/keyboard.js
          grep -q "const customerKeyboard=window.FreshWayCustomerKeyboard" app.js
          grep -q "customerKeyboard.bind({document,onHome:()=>setView('home')})" app.js
          grep -q "frontend/customer/keyboard.js" index.html
          ! grep -q "brandHome.*addEventListener('keydown'" index.html
          grep -q "window.FreshWayCustomerCartActions" frontend/customer/cart-actions.js
          grep -q "const customerCartActions=window.FreshWayCustomerCartActions" app.js
          grep -q "customerCartActions.bind({document,changeQty,toast})" app.js
          grep -q "frontend/customer/cart-actions.js" index.html
          ! grep -q "const add=t.closest('\[data-add\]')" app.js
          grep -q "window.FreshWayCustomerCartBar" frontend/customer/cart-bar.js
          grep -q "const customerCartBar=window.FreshWayCustomerCartBar" app.js
          grep -q "customerCartBar.update(document,{count:cartCount(),total:cartTotal(),money})" app.js
          grep -q "frontend/customer/cart-bar.js" index.html
          ! grep -q "function updateCartBar(){const n=cartCount()" app.js
      - name: Enforce backend feature boundaries
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const auth = fs.readFileSync('worker/src/admin-auth.js', 'utf8');
          const data = fs.readFileSync('worker/src/admin-data.js', 'utf8');
          const notifications = fs.readFileSync('worker/src/admin-notifications.js', 'utf8');
          const response = fs.readFileSync('worker/src/admin-response.js', 'utf8');
          const required = [
            [auth, "from './admin-notifications.js'", 'admin-auth notification boundary'],
            [auth, "from './admin-response.js'", 'admin-auth response boundary'],
            [notifications, 'export async function notifyOrderChange', 'notification module export'],
            [response, 'export async function normalizeOwnerResponse', 'response module export'],
            [data, "from './admin-orders.js'", 'admin orders boundary'],
            [data, "from './admin-reports.js'", 'admin reports boundary'],
            [data, "from './admin-customers.js'", 'admin customers boundary'],
            [data, "from './admin-products.js'", 'admin products boundary']
          ];
          if (auth.includes("from 'web-push'")) throw new Error('admin-auth.js must not own web-push delivery');
          for (const [text, needle, label] of required) {
            if (!text.includes(needle)) throw new Error(`Missing ${label}: ${needle}`);
          }
          console.log('backend feature boundaries OK');
          NODE
      - name: Check D1 schema and migration
        working-directory: worker
        run: |
          test -s schema.sql
          grep -q "delivery_plan" schema.sql
          grep -q "INSERT OR IGNORE INTO products" schema.sql
          test -s migrations/0001_delivery_plan.sql
          grep -q "ALTER TABLE orders ADD COLUMN delivery_plan" migrations/0001_delivery_plan.sql
          test -s migrations/0002_order_idempotency.sql
          grep -q "client_order_id" migrations/0002_order_idempotency.sql
          test -s migrations/0003_auth_rate_limits.sql
          grep -q "auth_rate_limits" migrations/0003_auth_rate_limits.sql
          test -s migrations/0004_unique_customer_phone.sql
          grep -q "CREATE UNIQUE INDEX" migrations/0004_unique_customer_phone.sql
          test -s migrations/0005_customer_passcode_auth.sql
          grep -q "passcode_hash" migrations/0005_customer_passcode_auth.sql
          test -s migrations/0007_owner_order_lifecycle.sql
          grep -q "Out for Delivery" migrations/0007_owner_order_lifecycle.sql
          grep -q "Confirmed" migrations/0007_owner_order_lifecycle.sql
          grep -q "Ready" migrations/0007_owner_order_lifecycle.sql
          test -s migrations/0008_address_system_final.sql
          test -s migrations/0009_seed_default_catalogue.sql
          if find migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sed -E 's/^([0-9]+)_.*/\1/' | sort | uniq -d | grep -q .; then
            echo 'Duplicate D1 migration version prefix found' >&2
            exit 1
          fi
      - name: Check Worker configuration
        working-directory: worker
        run: node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8')); const required=['ADMIN_TOKEN','CUSTOMER_SESSION_SECRET','ADMIN_SESSION_SECRET']; if(!x.name||!x.main||!x.d1_databases?.[0]?.binding||x.main!=='src/admin-auth.js'||required.some(s=>!x.secrets?.required?.includes(s))||x.vars?.OTP_PROVIDER||x.secrets?.optional?.length) process.exit(1); console.log('wrangler configuration, secure entrypoint, required secrets, and no Twilio configuration OK')"
      - name: Check for committed secret values
        run: |
          ! grep -RInE '(WHATSAPP_ACCESS_TOKEN|VAPID_PRIVATE_KEY|ADMIN_TOKEN|CUSTOMER_SESSION_SECRET|ADMIN_SESSION_SECRET|TWILIO_ACCOUNT_SID|TWILIO_AUTH_TOKEN|TWILIO_VERIFY_SERVICE_SID)[[:space:]]*[:=][[:space:]]*[^$\"\047[:space:]]{20,}' --exclude-dir=.git --exclude='api.test.js' --exclude='secure-identity.test.js' . || (echo 'Possible committed secret value found' && exit 1)
      - name: Check test fixtures are non-production values
        run: |
          grep -q "fixture-admin" worker/test/api.test.js
          grep -q "fixture-customer-session" worker/test/api.test.js
