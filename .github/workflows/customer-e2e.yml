name: FreshWay customer browser E2E

on:
  pull_request:
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'address-system.css'
      - 'frontend/customer/**'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'admin/**'
      - 'functions/admin/**'
      - 'functions/admin-pwa.test.mjs'
      - 'admin.html'
      - 'admin.js'
      - 'admin.css'
      - 'owner-lifecycle.js'
      - 'owner-address-final.js'
      - 'frontend/admin/**'
      - 'frontend/catalogue-media.js'
      - 'frontend/media/catalogue/**'
      - 'icons/**'
      - 'e2e/**'
      - '.github/workflows/customer-e2e.yml'
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'address-system.css'
      - 'frontend/customer/**'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'admin/**'
      - 'functions/admin/**'
      - 'functions/admin-pwa.test.mjs'
      - 'admin.html'
      - 'admin.js'
      - 'admin.css'
      - 'owner-lifecycle.js'
      - 'owner-address-final.js'
      - 'frontend/admin/**'
      - 'frontend/catalogue-media.js'
      - 'frontend/media/catalogue/**'
      - 'icons/**'
      - 'e2e/**'
      - '.github/workflows/customer-e2e.yml'

# Deterministic browser regression gate.
jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: e2e
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install E2E dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run customer browser E2E
        env:
          FRESHWAY_LIVE_BASE_URL: https://fwcoldpressed.in
          FRESHWAY_OWNER_AUDIT_TOKEN: ${{ secrets.ADMIN_TOKEN || secrets.ADMIN_TTOKEN }}
        run: npm test

      - name: Upload responsive visual review screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: freshway-customer-visual-review
          path: e2e/test-results/visual-review/*
          if-no-files-found: warn
          retention-days: 7
