name: FreshWay customer browser E2E

on:
  pull_request:
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'address-system.css'
      - 'frontend/customer/**'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'admin/**'
      - 'functions/admin/**'
      - 'functions/admin-pwa.test.mjs'
      - 'admin.html'
      - 'admin.js'
      - 'admin.css'
      - 'owner-lifecycle.js'
      - 'owner-address-final.js'
      - 'frontend/admin/**'
      - 'frontend/catalogue-media.js'
      - 'frontend/media/catalogue/**'
      - 'icons/**'
      - 'e2e/**'
      - 'worker/**'
      - '.github/workflows/customer-e2e.yml'
      - '.github/actions/setup-playwright/**'
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'address-system.css'
      - 'frontend/customer/**'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'admin/**'
      - 'functions/admin/**'
      - 'functions/admin-pwa.test.mjs'
      - 'admin.html'
      - 'admin.js'
      - 'admin.css'
      - 'owner-lifecycle.js'
      - 'owner-address-final.js'
      - 'frontend/admin/**'
      - 'frontend/catalogue-media.js'
      - 'frontend/media/catalogue/**'
      - 'icons/**'
      - 'e2e/**'
      - 'worker/**'
      - '.github/workflows/customer-e2e.yml'

# Deterministic browser regression gate.
jobs:
  playwright-browser-cache:
    name: Prepare shared Playwright Chromium cache
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Prepare cached Playwright browser
        uses: ./.github/actions/setup-playwright

  browser-e2e:
    needs: playwright-browser-cache
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: e2e
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Prepare cached Playwright browser
        uses: ./.github/actions/setup-playwright

      - name: Run customer browser E2E
        run: npm test

      - name: Upload responsive visual review screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: freshway-customer-visual-review
          path: e2e/test-results/visual-review/*
          if-no-files-found: warn
          retention-days: 7

  isolated-store-fallback:
    needs: playwright-browser-cache
    name: Isolated D1 store fallback Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Worker dependencies
        working-directory: worker
        run: npm install

      - name: Create isolated local D1 schema
        working-directory: worker
        run: npx wrangler d1 execute freshway --local --config wrangler.jsonc --file schema.sql

      - name: Seed deterministic two-store fixture
        working-directory: worker
        run: |
          npx wrangler d1 execute freshway --local --config wrangler.jsonc --command "INSERT INTO categories (id,name,slug,icon,active) VALUES ('test-category','Test Category','test-category','🛒',1); INSERT INTO products (id,name,unit,price,emoji,active,category_id,display_order,stock_managed,stock_quantity,low_stock_threshold) VALUES ('test-rice','Test Rice','kg',100,'🌾',1,'test-category',1,1,5,1),('test-oil','Test Oil','litre',150,'🫒',1,'test-category',2,1,5,1),('test-inactive-only','Inactive-only product','piece',50,'🛒',1,'test-category',3,1,5,1); INSERT INTO delivery_stores (id,name,address,latitude,longitude,service_radius_km,is_active) VALUES ('store-nearest','Nearest Store','Isolated Playwright fixture',17.385,78.4867,5,1),('store-fallback','Fallback Store','Isolated Playwright fixture',17.400,78.500,5,1),('store-inactive','Inactive Store','Isolated Playwright fixture',17.405,78.505,5,0); INSERT INTO delivery_store_inventory (store_id,product_id,stock_quantity) VALUES ('store-nearest','test-rice',0),('store-nearest','test-oil',5),('store-nearest','test-inactive-only',0),('store-fallback','test-rice',5),('store-fallback','test-oil',0),('store-fallback','test-inactive-only',0),('store-inactive','test-rice',5),('store-inactive','test-oil',5),('store-inactive','test-inactive-only',5); INSERT INTO delivery_store_catalogue (store_id,product_id,is_available,price_override) VALUES ('store-nearest','test-rice',1,NULL),('store-nearest','test-oil',1,NULL),('store-nearest','test-inactive-only',1,NULL),('store-fallback','test-rice',1,NULL),('store-fallback','test-oil',1,NULL),('store-fallback','test-inactive-only',1,NULL),('store-inactive','test-rice',1,NULL),('store-inactive','test-oil',1,NULL),('store-inactive','test-inactive-only',1,NULL);"

      - name: Start local Worker with isolated D1
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          CUSTOMER_SESSION_SECRET="isolated-customer-secret" npx wrangler dev --local --config wrangler.jsonc --ip 127.0.0.1 --port 8787 > "$RUNNER_TEMP/freshway-isolated-worker.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/freshway-isolated-worker.pid"
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8787/api/health > /dev/null; then
              echo "Isolated Worker is ready."
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/freshway-isolated-worker.log"
          echo "::error::Isolated Worker did not become ready."
          exit 1

      - name: Prepare cached Playwright browser
        uses: ./.github/actions/setup-playwright

      - name: Run isolated store fallback Playwright tests
        working-directory: e2e
        env:
          FRESHWAY_PRODUCTION_URL: http://127.0.0.1:8787
          FRESHWAY_TEST_STORE_ID: store-fallback
          FRESHWAY_TEST_LATITUDE: '17.400'
          FRESHWAY_TEST_LONGITUDE: '78.500'
          FRESHWAY_TEST_PRODUCT_ID: test-rice
          FRESHWAY_TEST_CATEGORY_ID: test-category
          FRESHWAY_TEST_FALLBACK_READY: 'true'
          FRESHWAY_TEST_FALLBACK_LATITUDE: '17.386'
          FRESHWAY_TEST_FALLBACK_LONGITUDE: '78.487'
          FRESHWAY_TEST_NEAREST_STORE_ID: store-nearest
          FRESHWAY_TEST_FALLBACK_STORE_ID: store-fallback
          FRESHWAY_TEST_FALLBACK_PRODUCT_ID: test-rice
        run: npx playwright test --config=playwright.production.config.js --grep "production availability falls back"

      - name: Upload isolated Playwright evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: freshway-isolated-store-fallback-playwright
          path: e2e/test-results/production/
          if-no-files-found: warn
          retention-days: 7
  isolated-real-d1-store-checkout:
    needs: playwright-browser-cache
    name: Isolated real D1 customer store catalogue Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Worker dependencies
        working-directory: worker
        run: npm install

      - name: Create local-only Wrangler config
        working-directory: worker
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const config=JSON.parse(fs.readFileSync('wrangler.dev.jsonc','utf8'));
          config.name='freshway-api-real-d1-e2e';
          config.vars={...config.vars,
            APP_ORIGIN:'http://localhost:4173',
            APP_ORIGINS:'http://localhost:4173',
            APP_ORIGIN_SUFFIXES:''
          };
          fs.writeFileSync('wrangler.real-d1.jsonc',JSON.stringify(config,null,2));
          NODE

      - name: Create a fresh isolated D1 schema and seed store fixtures
        working-directory: worker
        run: |
          set -euo pipefail
          npx wrangler d1 execute freshway-development --local --config wrangler.real-d1.jsonc --file schema.sql
          npx wrangler d1 execute freshway-development --local --config wrangler.real-d1.jsonc --command "INSERT INTO categories (id,name,slug,icon,active) VALUES ('cat-oils-d1','Oils','oils-d1','🫒',1),('cat-rice-d1','Rice','rice-d1','🍚',1); INSERT INTO products (id,name,unit,price,emoji,active,category_id,display_order,stock_managed,stock_quantity,low_stock_threshold) VALUES ('oil-d1','Groundnut Oil','litre',220,'🫙',1,'cat-oils-d1',1,1,10,1),('rice-d1','Basmati Rice','kg',150,'🍚',1,'cat-rice-d1',2,1,10,1); INSERT INTO delivery_stores (id,name,address,latitude,longitude,service_radius_km,is_active) VALUES ('store-d1','D1 Store','Isolated Worker + D1 E2E',17.385044,78.486671,5,1); INSERT INTO delivery_store_inventory (store_id,product_id,stock_quantity) VALUES ('store-d1','oil-d1',10),('store-d1','rice-d1',10); INSERT INTO delivery_store_catalogue (store_id,product_id,is_available,price_override) VALUES ('store-d1','oil-d1',1,189),('store-d1','rice-d1',1,233); INSERT INTO store_profile (id,store_name,address) VALUES (1,'FreshWay','Mancherial, Telangana') ON CONFLICT(id) DO UPDATE SET store_name=excluded.store_name,address=excluded.address; INSERT INTO coupons (id,code,title,discount_amount,first_order_only,starts_on,active) VALUES ('coupon-money-d1','WELCOME50','Money E2E fixed discount',50,0,'2026-01-01',1); UPDATE invoice_settings SET enabled=1,document_type='commercial_invoice',series_prefix='FW',prices_include_tax=0 WHERE id=1;"

      - name: Start the real Worker against local D1
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          ADMIN_TOKEN="isolated-admin-token" ADMIN_SESSION_SECRET="isolated-admin-session-secret" CUSTOMER_SESSION_SECRET="isolated-customer-secret" npx wrangler dev --local --config wrangler.real-d1.jsonc --ip 0.0.0.0 --port 8787 > "$RUNNER_TEMP/freshway-real-d1-worker.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/freshway-real-d1-worker.pid"
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://localhost:8787/api/health > /dev/null; then
              echo "Real Worker with isolated D1 is ready."
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/freshway-real-d1-worker.log"
          echo "::error::Real Worker with isolated D1 did not become ready."
          exit 1

      - name: Install Playwright dependencies
        working-directory: e2e
        run: npm install

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run customer storefront and checkout against real Worker + isolated D1
        working-directory: e2e
        run: npx playwright test --config=playwright.real-d1.config.js

      - name: Upload real D1 browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: freshway-real-d1-customer-store-catalogue-playwright
          path: e2e/test-results/real-d1/
          if-no-files-found: warn
          retention-days: 7
