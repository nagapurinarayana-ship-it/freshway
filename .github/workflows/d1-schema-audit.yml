name: FreshWay production D1 schema audit

on:
  # Run after the production release has applied migrations and deployed the Worker.
  # This avoids racing the migration step on pushes that change worker/**.
  workflow_run:
    workflows: ["FreshWay Worker release"]
    types: [completed]
  # Allow the workflow edit itself to be validated; it does not deploy Worker code.
  push:
    branches: [main]
    paths:
      - ".github/workflows/d1-schema-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freshway-production-d1-schema-audit
  cancel-in-progress: false

jobs:
  audit:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    name: Read-only production D1 schema audit
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout the code used by the production release
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install Worker dependencies
        working-directory: worker
        run: npm install
      - name: Require production credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Inspect production D1 schema without writes
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/audit-production-schema.mjs
      - name: Verify receipt seller values without writes
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute freshway --remote --config wrangler.jsonc --command "SELECT legal_name, business_address, CASE WHEN LOWER(TRIM(legal_name)) = 'sunshine enterprises (freshway)' THEN 1 ELSE 0 END AS legal_name_matches, CASE WHEN TRIM(business_address) = '1-1-LA0022, Road No 2, Laxminagar, Mancherial 504208' THEN 1 ELSE 0 END AS business_address_matches FROM invoice_settings WHERE id=1" --json
          npx wrangler d1 execute freshway --remote --config wrangler.jsonc --command "SELECT store_name, address, CASE WHEN TRIM(address) = '1-1-LA0022, Road No 2, Laxminagar, Mancherial 504208' THEN 1 ELSE 0 END AS address_matches, CASE WHEN LENGTH(REPLACE(REPLACE(REPLACE(phone, '+', ''), ' ', ''), '-', '')) >= 10 THEN 1 ELSE 0 END AS phone_present FROM store_profile WHERE id=1" --json
