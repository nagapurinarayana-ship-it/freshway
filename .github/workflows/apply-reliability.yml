          old="""JSON.stringify({customerId:customerId(),customer:data,address,items:cartItems().map(x=>({id:x.product.id,qty:x.qty})),whatsappOptIn})"""
          new="""JSON.stringify({customerId:customerId(),clientOrderId,customer:data,address,items:cartItems().map(x=>({id:x.product.id,qty:x.qty})),whatsappOptIn})"""
          if old not in s: raise SystemExit('order body anchor not found')
          s=s.replace(old,new,1)
          old="""state.profile.checkout={name:data.name,phone:data.phone,address};save();await FreshWayNotifications.registerCustomer"""
          new="""state.profile.checkout={name:data.name,phone:data.phone,address};clearCheckoutClientId();save();await FreshWayNotifications.registerCustomer"""
