          PY
          git diff --check
          if git diff --quiet -- worker/src/index.js app.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/src/index.js app.js
          git commit -m 'reliability: wire checkout idempotency and order notifications'
          git push
